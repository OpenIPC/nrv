; ARI — REST-интерфейс Asterisk.
;
; Нужен по двум причинам:
;   1. от него зависит модуль WebSocket-транспорта нового драйвера
;      (res_pjsip_transport_websocket): без ARI он не загружается, и
;      регистрация приложений уходит в старый драйвер, где таких абонентов
;      нет — регистрация падает с «Wrong password» (проверено на живой
;      регистрации из браузера);
;   2. через него сервер будет получать события звонков для журнала и
;      управлять вызовами (ответить, положить, отправить DTMF).
;
; Учётные данные — в подключаемом файле: он в репозиторий не попадает,
; пароль задаёт установка.

[general]
enabled = yes
pretty = yes
; Слушаем только localhost: ARI — внутренний интерфейс сервера, наружу его
; открывать незачем (и опасно: это полный контроль над звонками).
bindaddr = 127.0.0.1

; Пользователи ARI — из подключаемого файла.
#include accounts/ari_users.conf
