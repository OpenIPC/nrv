; Единственный драйвер SIP (chan_pjsip).
;
; Здесь и приложения, и устройства. Раньше было два драйвера: приложения на
; этом, устройства на старом chan_sip — считалось, что панели и
; видеодомофоны с новым драйвером работают некорректно. После обновления
; прошивок панелей (13.10.2026) это перестало быть правдой, и старый
; драйвер убран целиком: он помечен устаревшим и удалён в новых ветвях
; Asterisk, а два драйвера означали две ветки кода и лишний повод для
; ошибок. Порядок перехода — plans/pjsip-realtime-migration.md.
;
; Приложениям нужен WebRTC, а это SIP over WebSocket + DTLS-SRTP + ICE.
; Устройствам всё это не нужно: они подключаются обычным SIP по UDP, а
; отличие в настройках описано в шаблоне [endpoint-app] и в файле абонентов,
; который сервер собирает сам.

; --- Транспорт для приложений ---
;
; ОТДЕЛЬНОГО ПОРТА У WS-ТРАНСПОРТА НЕТ. WebSocket в Asterisk отдаёт его
; собственный HTTP-сервер, а порт задаётся в http.conf (у нас 8088).
; Проверено: при bind=0.0.0.0:8089 порт 8089 не слушался, а подключение
; проходило на 8088/ws.
;
; Но поле bind всё равно ОБЯЗАТЕЛЬНО. Без него Asterisk отказывается
; создавать транспорт:
;
;   ERROR: Transport 'transport-ws' could not be started as binding not specified
;   ERROR: Could not create an object of type 'transport' with id 'transport-ws'
;
; При запуске это сходило с рук (транспорт поднимался раньше), но при каждом
; обновлении конфигурации — а сервер пересобирает её после любой правки
; домофонии — транспорт пропадал вместе с соединениями приложений. Снаружи
; это выглядело как «телефон постоянно переподключается», и вместе с
; соединением рвался идущий разговор. Порт в bind указываем тот же, что в
; http.conf: значение здесь не используется, но путаницы не создаёт.
;
; САМА СЕКЦИЯ ЗДЕСЬ НЕ ОПИСАНА: её собирает сервер из настроек телефонии
; (файл accounts/pjsip_transport.conf). Так в неё попадают внешний адрес и
; список своих сетей — без них телефон в мобильной сети регистрируется, но
; разговор остаётся без звука и видео: станция предлагает ему локальный
; адрес. Двух секций с одним именем быть не должно — Asterisk разберёт их
; непредсказуемо.
#include accounts/pjsip_transport.conf

; --- Абоненты ---
;
; СЕКЦИЙ АБОНЕНТОВ ЗДЕСЬ НЕТ и быть не должно.
;
; Настройки панелей, мониторов, трубок и приложений Asterisk читает из таблиц
; своей базы (`ps_endpoints`, `ps_auths`, `ps_aors`), а регистрации устройств
; складывает в `ps_contacts`. Соответствие задано в `sorcery.conf` и
; `extconfig.conf`, а доступ к базе — в `res_pgsql.conf`; все три файла
; собирает сервер (см. service/asterisk_realtime.go).
;
; Почему так, а не файлом, как было раньше. Файл приходилось перечитывать
; целиком после каждой правки домофонии, а перечитывание
; (`module reload res_pjsip.so`) обрывало соединения приложений: телефон,
; который в этот момент разговаривал, терял линию. С realtime настройки
; читаются при каждой регистрации и каждом вызове, поэтому reload не нужен
; вовсе — и вот из-за этого в нерабочей ветке разработки висел целый класс
; ошибок «правка одного абонента ломает разговор другому».
;
; Напоминание для диагностики: если абонент «пропал», смотреть надо таблицы
; (`SELECT id FROM ps_endpoints`), а не файлы — в файлах его отродясь нет.

