; Новый драйвер SIP (chan_pjsip).
;
; Здесь живут приложения: браузерное рабочее место, мобильное приложение и
; десктоп-клиент. Причина одна — WebSocket. У старого драйвера его нет, а
; WebRTC без WebSocket не поднять; зато новый драйвер тянет за собой
; DTLS-SRTP и ICE, которые браузер и телефон требуют обязательно.
;
; Устройства (панель, видеодомофон, трубка) подключаются к chan_sip —
; см. sip.conf и объяснение там.

; --- Транспорт для приложений ---
;
; ОТДЕЛЬНОГО ПОРТА У WS-ТРАНСПОРТА НЕТ. WebSocket в Asterisk отдаёт его
; собственный HTTP-сервер, а порт задаётся в http.conf (у нас 8088).
; Проверено: при bind=0.0.0.0:8089 порт 8089 не слушался, а подключение
; проходило на 8088/ws.
;
; Но поле bind всё равно ОБЯЗАТЕЛЬНО. Без него Asterisk отказывается
; создавать транспорт:
;
;   ERROR: Transport 'transport-ws' could not be started as binding not specified
;   ERROR: Could not create an object of type 'transport' with id 'transport-ws'
;
; При запуске это сходило с рук (транспорт поднимался раньше), но при каждом
; обновлении конфигурации — а сервер пересобирает её после любой правки
; домофонии — транспорт пропадал вместе с соединениями приложений. Снаружи
; это выглядело как «телефон постоянно переподключается», и вместе с
; соединением рвался идущий разговор. Порт в bind указываем тот же, что в
; http.conf: значение здесь не используется, но путаницы не создаёт.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; --- Шаблоны ---
;
; Шаблоны описывают общее для всех приложений. Каждое приложение получает
; СВОЙ номер (решение владельца системы): в журнале звонков видно, кто
; ответил, и можно отключить одно устройство, не задев остальные.

[endpoint-app](!)
type=endpoint
; Вызовы от приложений разбирает этот контекст (звонок на панель).
context=from-apps

disallow=all
; Opus — основной кодек для WebRTC (его поддерживают браузер, iOS и
; Android), G.711 оставлен как запасной: он точно пройдёт, если клиент
; не согласует Opus.
allow=opus,alaw,ulaw

; webrtc=yes включает DTLS-SRTP (шифрование медиа), ICE и согласование
; ICE-кандидатов. Без него браузер откажется: он не умеет незашифрованный
; RTP. Значение dtmf_mode тоже важно — WebRTC передаёт сигналы нажатия
; отдельным сообщением, а не тонами.
webrtc=yes
dtmf_mode=rfc4733

; Медиа через сервер: иначе разговор обошёл бы наши правила и журнал.
direct_media=no

; Удержание и переадресация нам не нужны — отключаем лишнюю музыку.
moh_suggest=default

[auth-app](!)
type=auth
auth_type=userpass

[aor-app](!)
type=aor
; Приложение может переподключиться, не успев отменить старую регистрацию
; (перезапуск, смена сети). Запас в несколько контактов избавляет от
; ситуации «звонит, а трубка молчит».
max_contacts=5
; Сервер проверяет, на связи ли приложение.
qualify_frequency=30
remove_existing=yes

; Абоненты приложений собираются сервером из базы — как и устройства
; в sip.conf. Файл в репозиторий не попадает: в нём пароли.
#include accounts/pjsip_accounts.conf
