; Модули Asterisk.
;
; autoload=yes — грузим всё, что есть в сборке: зависимости SIP-стека
; (res_pjsip_transport_websocket, res_http_websocket) подключаются сами.
;
; Драйвер SIP теперь ОДИН — chan_pjsip. Раньше рядом работал старый
; chan_sip: считалось, что панели и видеодомофоны с новым драйвером ведут
; себя некорректно. После обновления прошивок панелей (13.10.2026) это
; перестало быть правдой, а сам старый драйвер помечен устаревшим и удалён
; в новых ветвях Asterisk. Поэтому он отключён ниже — см.
; plans/pjsip-realtime-migration.md.
;
; Устройства при этом не перенастраивали: новый драйвер занял тот же
; UDP-порт 5060, куда они и ходили раньше.

[modules]
autoload=yes

; Старый драйвер SIP не загружаем вообще.
;
; Почему именно noload, а не «оставить и не использовать»: пока модуль
; загружен, он занимает UDP-порт 5060, а его подпротокол 'sip' в HTTP-сервере
; перехватывает регистрацию WebSocket у нового драйвера — по алфавиту
; chan_sip грузится раньше (уже ловили это: регистрация приложения падала
; с «Wrong password»).
;
; В ветке Asterisk 20 модуля нет вовсе — там строка ничего не делает и
; остаётся только напоминанием.
noload => chan_sip.so

; Драйвер базы и механизм realtime должны загрузиться РАНЬШЕ pjsip.
;
; Почему именно так, а не «автозагрузка сама разберётся». Настройки абонентов
; живут в таблицах базы, и `sorcery.conf` связывает объекты pjsip с ними через
; механизм realtime. Собирают его два модуля: `res_config_pgsql` — доступ к
; базе, `res_sorcery_realtime` — сам механизм с именем `realtime`. Если любой
; из них грузится позже, `res_pjsip` не находит связку и отказывается работать
; вовсе:
;
;   ERROR: Wizard 'realtime' could not be applied to object type 'endpoint'
;          as it was not found
;   ERROR: res_pjsip.c: load_module: Failed to initialize SIP 'system'
;          configuration section. Aborting load
;
; Со стороны это выглядит так: станция поднялась, а абонентов нет ни одного и
; команды `pjsip show` не существует. Проверено на живом запуске: автозагрузка
; ставит pjsip раньше обоих модулей, поэтому порядок задаём руками.
preload => res_config_pgsql.so
preload => res_sorcery_realtime.so

; WebSocket должен принадлежать драйверу pjsip.
;
; Профилактика той же ошибки: preload грузит модуль до общего автозапуска,
; тогда подпротокол 'sip' достаётся новому драйверу при любой сборке.
preload => res_pjsip_transport_websocket.so

; Каналы для звуковой карты сервера не нужны: звук ходит только по сети.
; Без этого в журнал сыпались бы предупреждения об отсутствии ALSA.
noload => chan_alsa.so
noload => chan_console.so

; Драйвер старого SIP-стека для мобильных приложений не используем.
noload => chan_mobile.so

; Модули телефонной станции, которые к домофонии отношения не имеют. Они
; пытаются загрузиться, не находят своих конфигов и пишут ERROR в журнал —
; а журнал нужен чистым, чтобы в нём были видны настоящие ошибки.
;
; Важно: группы вызова у нас делаются штатным Dial, а не очередью вызовов,
; поэтому app_queue действительно не нужен.
noload => chan_oss.so
noload => chan_unistim.so
noload => pbx_ael.so
noload => pbx_dundi.so
noload => app_queue.so
noload => app_followme.so
noload => app_amd.so
noload => res_prometheus.so
noload => app_alarmreceiver.so

; Модули журнала вызовов (CDR) и журнала событий (CEL): они не находят
; своих конфигов и пишут ERROR при каждом запуске.
;
; Журнал звонков ведём сами, в своей базе: только там видно, из какой
; группы вызова ответили и к какой камере или двери относится звонок.
; Если позже понадобится быстрый путь, можно вернуть cdr_pgsql — он умеет
; писать прямо в нашу PostgreSQL.
noload => cdr_csv.so
noload => cdr_manager.so
noload => cdr_pgsql.so
noload => cdr_sqlite3_custom.so
noload => cel_manager.so
noload => cel_pgsql.so
noload => cel_sqlite3_custom.so

; Остальные подсистемы телефонной станции, которых у домофонии нет:
; автосекретарь, конференции, голосовая почта, парковка вызовов, факс.
; Без этого они пытаются загрузиться, не находят конфигов и засоряют
; журнал сообщениями об ошибке загрузки.
;
; Замечание: полностью убрать такие сообщения при autoload=yes нельзя —
; модулей без конфигов в сборке несколько десятков, и перечислять их все
; смысла нет. Настоящие ошибки ищутся по нашим подсистемам:
;   docker exec nvr-asterisk-1 asterisk -rx "pjsip show transports"
;   docker exec nvr-asterisk-1 asterisk -rx "module show like chan_sip"   # должно быть 0 модулей
noload => res_pjsip_notify.so
noload => res_parking.so
noload => app_agent_pool.so
noload => res_calendar.so
noload => app_confbridge.so
noload => app_page.so
noload => app_voicemail.so
noload => app_directory.so
noload => app_meetme.so
noload => app_minivm.so
noload => app_milliwatt.so
noload => app_morsecode.so
noload => app_fax.so
noload => res_fax.so
noload => res_phoneprov.so
noload => res_stun_monitor.so
noload => app_ices.so


