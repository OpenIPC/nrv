; Основной файл настроек Asterisk.
;
; Без него Asterisk запускается на встроенных умолчаниях и при каждом
; запуске пишет «Unable to open specified master config file
; '/etc/asterisk/asterisk.conf', using built-in defaults» — предупреждение
; безобидное, но мешает читать журнал, где мы ищем настоящие ошибки.
;
; Пути ниже совпадают со встроенными умолчаниями и с тем, как устроен
; образ; указаны явно, чтобы конфигурация была видна целиком, а не
; подразумевалась.

[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; Уровень подробности 3 — это обычная работа: видно регистрации устройств и
; ход вызова. Больше не нужно: журнал звонков мы ведём в своей базе.
verbose = 3
debug = 0

; Живём без записи в базу Asterisk (astdb): она бы дублировала нашу.
; Настройки устройств и групп — в базе сервера, а не здесь.
