; HTTP-сервер Asterisk.
;
; Нужен ради WebSocket: приложения (браузер, телефон, десктоп) подключаются
; к ws://АДРЕС:8088/ws — это и есть SIP over WebSocket. Через него идут
; регистрация и входящие вызовы; звук передаётся отдельным RTP поверх
; DTLS-SRTP (его включает webrtc=yes в pjsip.conf).
;
; Схема ws:// без шифрования выбрана сознательно: сервер и устройства в
; одной домашней сети. Если сервер станет доступен из интернета, здесь
; появятся сертификат и wss:// — иначе микрофон в браузере не разрешат
; (Chrome требует защищённый контекст).

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
