; Asterisk Manager Interface — служебный интерфейс управления.
;
; Нужен серверу для перезагрузки конфигурации после того, как оператор
; изменил абонентов или группы вызова в интерфейсе. Перезагрузка через AMI
; не разрывает идущие разговоры, в отличие от перезапуска контейнера —
; поэтому она и выбрана.
;
; Слушаем только 127.0.0.1: сервер и Asterisk стоят на одной машине, и
; выставлять управление Asterisk в сеть без необходимости нельзя.

[general]
enabled = yes
bindaddr = 127.0.0.1
port = 5038

; Файл со списком пользователей генерируется при развёртывании и в
; репозиторий не попадает: в нём пароль.
#include accounts/manager.conf
