; Старый драйвер SIP (chan_sip).
;
; Им пользуются вызывные панели, видеодомофоны и трубки: панель Beward
; DS07P-LP и видеодомофон Dahua с новым драйвером (chan_pjsip) работают
; некорректно — проверено владельцем системы на своём оборудовании.
;
; Приложения (браузер, телефон, десктоп) подключаются не сюда, а к
; chan_pjsip: у старого драйвера нет WebSocket вообще (см. pjsip.conf).

[general]
; Куда попадают вызовы от устройств. Дальше их разбирает extensions.conf.
context=from-devices

; Регистрация только по логину и паролю: без этого любой в сети мог бы
; позвонить «с панели» и открыть дверь.
allowguest=no

; Устройства работают по UDP — так устроены все наши панели и трубки.
; WebSocket старому драйверу не нужен: приложениями занимается chan_pjsip
; (см. модуль res_pjsip_transport_websocket в modules.conf — он грузится
; заранее, иначе подпротокол 'sip' забирает именно chan_sip).
udpbindaddr=0.0.0.0:5060
tcpenable=no
transport=udp

; Медиа всегда идёт через сервер.
;
; Прямое соединение устройств друг с другом сэкономило бы трафик, но
; обошло бы сервер: разговор «панель → трубка» состоялся бы, а в журнале
; звонков не появилось бы ни строки, и открыть дверь из интерфейса было
; бы нечем.
directmedia=no

; Устройства и сервер в одной сети — NAT не нужен.
nat=no

; Кодеки: G.711 для голоса и H.264 для видео.
;
; Видео нужно ради звонков с приложения: по нему видно, кто стоит у двери,
; а без него телефонный звонок превращается в разговор вслепую. Asterisk
; видео не перекодирует — он пропускает его как есть, поэтому кодек должен
; совпадать у обоих концов (приложение предлагает H.264).
disallow=all
allow=alaw,ulaw,h264

; Без этого chan_sip вообще не предлагает видео устройству — параметр
; относится к драйверу целиком, а не к отдельному абоненту. Проверено:
; без него в SDP к трубке нет секции `m=video`, и картинка не приходит.
videosupport=yes

; Устройство регистрируется раз в две минуты: чаще — лишний трафик,
; реже — сервер дольше не замечает пропажу связи.
defaultexpiry=120
minexpiry=60

; Проверка доступности устройства: сервер сам шлёт OPTIONS и знает,
; на связи ли панель. Без этого «нет ответа» выяснится только при вызове.
qualify=yes
qualifyfreq=30

language=ru
; Отсчёт до голосового сообщения о неверном номере.
; Нам он не нужен: ошибиться номером в домофонии негде.
;
; --- Шаблон устройства ---
;
; Общее для всех панелей, камер и трубок. Конкретный абонент добавляет к
; нему только своё: номер, пароль и подпись. Меняя поведение устройств,
; правят здесь, а не у каждого абонента по отдельности.
[device](!)
; friend — устройство и звонит, и принимает вызовы. Иначе пришлось бы
; заводить две записи на одно устройство (peer и user).
type=friend
; dynamic — устройство само регистрируется на сервере, а не прописывается
; по фиксированному адресу: адреса в домашней сети выдаёт DHCP, и они
; меняются после перезагрузки.
host=dynamic
context=from-devices
dtmfmode=rfc2833
disallow=all
; G.711 для голоса и H.264 для видео: у трубок и панелей тот же набор,
; поэтому согласование проходит без перекодирования.
allow=alaw,ulaw,h264
; Видео у устройства: трубок с экраном и панелей с камерой это касается
; напрямую — без разрешения они не отдают картинку.
videosupport=yes
; Сервер опрашивает устройство: пока панель на связи, видно в интерфейсе.
qualify=yes
qualifyfreq=30
directmedia=no
; Два канала хватает: вызов оператора и вызов от панели одновременно.
call-limit=2

; Абоненты (панели, камеры, мониторы) в этот файл не пишутся: их собирает
; сервер из своей базы и кладёт в подключаемый файл. Так пароли устройств
; не попадают в репозиторий, а в другом доме достаточно завести свои
; устройства в интерфейсе.
#include accounts/sip_accounts.conf

; Настройки, общие для всех абонентов: внешний адрес сервера и список своих
; сетей. Задаются на странице «Домофония» → «Настройки» — там их видно
; оператору, а здесь только подключается собранный сервером файл.
;
; Внешний адрес нужен, когда устройства находятся в другой сети: без него
; Asterisk сообщает им внутренний адрес, и звонок не устанавливается.
; Список своих сетей нужен вместе с ним — иначе внешний адрес применяется
; и к внутренним устройствам, и голос пытается идти через NAT.
#include accounts/server_settings.conf
