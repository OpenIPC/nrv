; План набора номера.
;
; Здесь только каркас и объяснение логики. Абоненты и списки групп вызова
; собирает сервер из своей базы и кладёт в подключаемые файлы каталога
; accounts — так состав группы «кто звонит, кому звоним» настраивается в
; веб-интерфейсе, а не правкой этого файла.

[general]
static=yes
; Сервер должен уметь дописывать правила в подключаемые файлы.
writeprotect=no
; Понятный отказ вместо тишины, если номера нет в плане.
clearglobalvars=no

; ----------------------------------------------------------------------
; Вызовы ОТ устройств: панель, камера с кнопкой вызова, видеодомофон.
; ----------------------------------------------------------------------
[from-devices]
; Заготовка на случай, если сервер ещё ничего не сгенерировал: вызов
; отклоняется сразу, и в журнале Asterisk видно причину. Молчание хуже —
; на панели это выглядит как «никто не отвечает».
exten => _X!,1,NoOp(Вызов ${CALLERID(num)} без настроенной группы вызова)
 same => n,Congestion()

; Сгенерированные правила групп. Пример того, что появится здесь для
; группы «все сразу»:
;
;   ; Панель зовёт всех участников группы «Все»
;   exten => 101,1,NoOp(Вызов с панели «Калитка»)
;    same => n,Dial(SIP/201&SIP/202&PJSIP/300&PJSIP/301,30)
;    same => n,Hangup()
;
; Для стратегии «по очереди» генерируются последовательные Dial с
; таймаутом одного шага:
;
;   exten => 101,1,Dial(SIP/201,15)
;    same => n,Dial(SIP/202,15)
;    same => n,Dial(PJSIP/300,15)
;    same => n,Hangup()
#include accounts/extensions_accounts.conf

; ----------------------------------------------------------------------
; Прямой набор внутреннего номера с устройства.
;
; Раньше этого не было: устройство могло звонить только «в группу», и
; позвонить, например, с трубки на монитор было нельзя. Теперь можно —
; набрать номер другого абонента напрямую.
;
; Сгенерированные правила групп подключаются выше и остаются в силе:
; у Asterisk точный номер (200, 201) имеет приоритет над шаблоном, а
; номера устройств начинаются с единицы, так что пересечения нет.
exten => _1XX,1,NoOp(Прямой вызов ${EXTEN} от ${CALLERID(num)})
 same => n,Dial(SIP/${EXTEN},30)
 same => n,Hangup()

; Приложение живёт на другом драйвере (WebRTC), поэтому канал PJSIP.
exten => _3XX,1,NoOp(Прямой вызов приложения ${EXTEN} от ${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; ----------------------------------------------------------------------
; Вызовы ОТ приложений: оператор звонит на устройство.
; ----------------------------------------------------------------------
[from-apps]
; Номера устройств — 1XX (панель, камеры, мониторы), номера приложений —
; 3XX. Разные диапазоны нужны, чтобы в журнале и в настройках групп было
; видно, кто есть кто, и чтобы приложение не могло случайно «позвонить
; приложению» через этот контекст.
exten => _1XX,1,NoOp(${CALLERID(num)} звонит устройству ${EXTEN})
 same => n,Dial(SIP/${EXTEN},30)
 same => n,Hangup()

; Прямой вызов другого приложения: телефон — телефон.
;
; Без этого правила второго телефона в сети как бы не было: набрать 302
; с аппарата 301 было нельзя, и в списке абонентов его не показывали.
; Номера приложений — 3XX и живут на WebRTC-драйвере, поэтому канал PJSIP.
exten => _3XX,1,NoOp(${CALLERID(num)} звонит приложению ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Группы вызова — тот же список, что и у устройств.
;
; Без этого приложение не могло позвонить в группу: правила групп лежат в
; подключаемом файле, и он был подключён только в контексте устройств
; ([from-devices]). Вызов из приложения попадал сюда, не находил номера
; группы и обрывался — при том что с панели или трубки та же группа
; работала.
;
; Подключаем ПОСЛЕ прямых вызовов: конкретный номер должен иметь приоритет
; над группой, если они совпали.
#include accounts/extensions_accounts.conf
