; План набора номера.
;
; Здесь только каркас и объяснение логики. Состав групп вызова сервер
; собирает из своей базы и кладёт в таблицу `extensions` — так «кто звонит,
; кому звоним» настраивается в веб-интерфейсе, а не правкой этого файла.
; Подключение к таблице — строки `switch => Realtime/…@extensions` ниже.

[general]
static=yes
; Разрешить станции сохранять план набора в файл. Нужно для ручной работы:
; `dialplan save` выгружает действующие правила (включая прочитанные из базы)
; в файл — так их удобно посмотреть, когда под рукой нет клиента базы.
writeprotect=no
; Незаполненные глобальные переменные нестираются при перечитывании: у нас
; их ставит сам вызов (CALLLIST, DIALTARGETS), и терять их нельзя.
clearglobalvars=no

; ----------------------------------------------------------------------
; Вызовы ОТ устройств: панель, камера с кнопкой вызова, видеодомофон.
; ----------------------------------------------------------------------
[from-devices]
; ВНИМАНИЕ, проверено на живом стенде: шаблон, объявленный в этом файле,
; перехватывает вызов РАНЬШЕ, чем станция обратится к правилам в базе. Вызов в
; группу 201 уходил в Congestion, хотя правило для 201 лежало в таблице.
; Поэтому отказ на неизвестный номер тоже живёт в базе (шаблон `_X!` пишет
; сервер) — здесь его быть не должно.

; Сгенерированные правила групп. Пример того, что появляется здесь для
; группы «все сразу»:
;
;   exten => 200,1,NoOp(Вызов от ${CALLERID(num)} в группу «Все устройства»)
;    same => n,Dial(PJSIP/114&PJSIP/116&PJSIP/301,30)
;    same => n,Hangup()
;
; САМИХ ПРАВИЛ ЗДЕСЬ НЕТ: они лежат в таблице `extensions` базы, и сервер
; переписывает их после каждой правки групп в интерфейсе. Не ищите их в файлах —
; если нужно посмотреть, что станция выполнит, смотрите таблицу:
;   SELECT exten, priority, app, appdata FROM extensions WHERE context='from-devices';
;
; Причина одна — время. С файлом правка группы ждала перечитывания плана
; набора: человека, которого только что добавили в группу, вызвать было ещё
; нельзя. Через `switch` правила читаются при каждом вызове.
switch => Realtime/from-devices@extensions

; ----------------------------------------------------------------------
; Прямой набор внутреннего номера с устройства.
;
; Раньше этого не было: устройство могло звонить только «в группу», и
; позвонить, например, с трубки на монитор было нельзя. Теперь можно —
; набрать номер другого абонента напрямую.
;
; Сгенерированные правила групп подключаются выше и остаются в силе:
; у Asterisk точный номер (200, 201) имеет приоритет над шаблоном, а
; номера устройств начинаются с единицы, так что пересечения нет.
exten => _1XX,1,NoOp(Прямой вызов ${EXTEN} от ${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Приложения живут на том же драйвере, но дозваниваемся до них через
; отдельный контекст: у линии приложения есть повтор набора, из-за которого
; звонок доживает до проснувшегося телефона (см. [app-line] ниже).
; Без этого прямой набор номера обрывался сразу, если телефон в блокировке.
exten => _3XX,1,NoOp(Прямой вызов приложения ${EXTEN} от ${CALLERID(num)})
 same => n,Dial(Local/${EXTEN}@app-line,30)
 same => n,Hangup()

; Раньше здесь подключался файл accounts/extensions_devices.conf с точными
; номерами устройств, переведённых на новый драйвер по одному. Файл больше
; не нужен и не генерируется: драйвер один, и шаблон _1XX уже описывает все
; устройства сразу.

; ----------------------------------------------------------------------
; Вызовы ОТ приложений: оператор звонит на устройство.
; ----------------------------------------------------------------------
[from-apps]
; Номера устройств — 1XX (панель, камеры, мониторы), номера приложений —
; 3XX. Разные диапазоны нужны, чтобы в журнале и в настройках групп было
; видно, кто есть кто, и чтобы приложение не могло случайно «позвонить
; приложению» через этот контекст.
exten => _1XX,1,NoOp(${CALLERID(num)} звонит устройству ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Прямой вызов другого приложения: телефон — телефон.
;
; Без этого правила второго телефона в сети как бы не было: набрать 302
; с аппарата 301 было нельзя, и в списке абонентов его не показывали.
; Номера приложений — 3XX и живут на том же драйвере; дозвон идёт через
; контекст приложения — там повтор набора (см. [app-line]).
exten => _3XX,1,NoOp(${CALLERID(num)} звонит приложению ${EXTEN})
 same => n,Dial(Local/${EXTEN}@app-line,30)
 same => n,Hangup()

; Группы вызова — тот же список, что и у устройств, и лежит он в той же
; таблице базы.
;
; Без этого приложение не могло позвонить в группу: правила групп были в
; подключаемом файле, а он подключался только в контексте устройств
; ([from-devices]). Вызов из приложения попадал сюда, не находил номера
; группы и обрывался — при том что с панели или трубки та же группа
; работала.
;
; Один и тот же `switch` в двух контекстах — не дублирование: правила
; набора принадлежат контексту, и каждому контексту нужен свой доступ к ним.
; В таблице строки записаны сразу для обоих контекстов (сервер пишет их
; парами), поэтому правка группы не требует правки этого файла.
switch => Realtime/from-apps@extensions

; ----------------------------------------------------------------------
; Дозвон до линии приложения (мобильное приложение, браузер, десктоп).
;
; Сюда приходят не набором номера, а через локальный канал:
; Dial(Local/304@app-line) — так правило группы зовёт приложение.
;
; Почему отдельный контекст, а не прямой Dial(PJSIP/304) в группе. Телефон
; в блокировке замораживает приложение, регистрация снимается, и станция не
; может создать диалог: вызов обрывается сразу, человек у двери видит «нет
; абонента». Проснуться телефону помогает push (его отправляет сервер, увидев
; начало набора), но на пробуждение и регистрацию нужно несколько секунд —
; ровно их и даёт повтор набора, который лежит в этом контексте.
;
; Правила (сколько попыток и по сколько секунд) — в таблице `extensions`:
;   SELECT exten, priority, app, appdata FROM extensions WHERE context='app-line';
[app-line]
switch => Realtime/app-line@extensions
