; Параметры RTP — транспорта, по которому идёт сам звук.
;
; Диапазон сужен сознательно. По умолчанию Asterisk берёт 10000-20000, и
; это две с лишним тысячи портов, которые пришлось бы пробрасывать на
; роутере. У нас устройства и сервер в одной сети, одновременных разговоров
; единицы: один разговор занимает два порта (в каждую сторону).

; Сами параметры задаются на странице «Домофония → Настройки» и попадают
; сюда из базы (файл accounts/rtp_settings.conf):
;
;   - диапазон портов разговора — его же пробрасывают на роутере;
;   - адрес STUN — через него станция узнаёт свой внешний адрес; без этого
;     звонок из мобильной сети проходит без звука и видео.
;
; Правки этого файла перезапишет сервер при следующей сборке конфигурации,
; поэтому значения меняйте в интерфейсе.
#include accounts/rtp_settings.conf
