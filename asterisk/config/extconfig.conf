; Файл собран сервером. Правки будут перезаписаны.
; Какая таблица стоит за именем объекта: `ps_endpoints` — абоненты,
; `extensions` — правила набора (см. switch => Realtime в extensions.conf).

[settings]
ps_endpoints => pgsql,ps_endpoints
ps_auths => pgsql,ps_auths
ps_aors => pgsql,ps_aors
ps_contacts => pgsql,ps_contacts
extensions => pgsql,extensions
