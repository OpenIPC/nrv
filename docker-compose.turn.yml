# TURN-сервер (coturn) — посредник для медиа в чужих сетях.
#
# Зачем. WebRTC ищет путь между телефоном и сервером напрямую: телефон
# сообщает свои адреса, сервер — свои. В домашней сети и в мобильном
# интернете путь находится, а в чужой сети часто нет: UDP наружу закрыт
# или NAT устроен так, что ответные пакеты приходят не туда. Снаружи это
# выглядит как «приложение подключилось, но вызов не соединяется»:
# сигнализация идёт по TCP и проходит, а голос — по UDP и не проходит.
#
# TURN принимает медиа на себя и передаёт дальше. Это единственный способ
# работать через такой NAT, и он же даёт путь по TCP и по TLS — для сетей,
# где разрешены только 80/443.
#
# Включается отдельным профилем, потому что нужен не каждой установке,
# а той, к которой обращаются снаружи:
#
#   docker compose --profile turn up -d turn
#
# Что подготовить заранее:
#   * в .env — TURN_USER, TURN_PASSWORD, TURN_REALM, TURN_EXTERNAL_IP.
#     Логин и пароль вводятся ещё и в интерфейсе (страница домофонии,
#     «Медиа разговора»): оттуда их получает приложение вместе со своей
#     линией, поэтому значения там и здесь должны совпадать;
#   * сертификат для TLS в каталоге turn/certs: turn.crt и turn.key;
#   * проброс на роутере: 3478 tcp и udp, 5349 tcp, 443 tcp (на порт 5349),
#     49160-49260 udp (диапазон ретрансляции).
services:
  turn:
    # Версия закреплена: на стенде проверено coturn 4.18.0, и на новой
    # машине должен подняться тот же релиз — TURN участвует в установке
    # медиапотока, и его поведение между релизами меняется.
    image: coturn/coturn:4.18.0-alpine
    profiles: ["turn"]
    # host-сеть обязательна: иначе TURN сообщает клиенту адрес из bridge-сети,
    # и медиа уходит в никуда. Проверено на живом сервере — с bridge-сетью
    # ретрансляция не поднимается.
    network_mode: host
    restart: unless-stopped
    volumes:
      # Сертификат и ключ для TLS. В репозиторий не попадают: ключ локальный,
      # у каждой установки свой (см. .gitignore).
      #
      # Ключ читает процесс coturn, который работает от nobody, поэтому файл
      # должен быть ему доступен (chgrp 65534 и права 640 — так делает
      # scripts/turn-cert.sh). С правами 600 и владельцем root coturn молча
      # не поднимает TLS: в журнале — «private key file is not set properly»,
      # а порт 5349 просто отсутствует.
      - ./turn/certs:/certs:ro
    command:
      - "--listening-port=3478"
      # Порт TLS (turns:). Порт 443 отдельным слушателем не открываем:
      # coturn поднимает его только вместе с парным --alt-listening-port, а
      # непривилегированный процесс всё равно не может занять порт ниже 1024.
      # Вместо этого на роутере 443 пробрасывается на этот порт — для клиента
      # это выглядит как TURN на 443, а на сервере всё остаётся обычным.
      - "--tls-listening-port=5349"
      # Диапазон портов ретрансляции. Сужаем намеренно: каждый разговор
      # занимает несколько портов, а открывать весь штатный диапазон
      # 49152-65535 на роутере незачем и небезопасно.
      - "--min-port=49160"
      - "--max-port=49260"
      - "--lt-cred-mech"
      - "--user=${TURN_USER:-nvr}:${TURN_PASSWORD:-change-me}"
      - "--realm=${TURN_REALM:-nvr}"
      # Внешний адрес: без него TURN отдаёт клиенту внутренний адрес сервера,
      # и ретрансляция не работает за NAT.
      - "--external-ip=${TURN_EXTERNAL_IP:-}"
      - "--cert=/certs/turn.crt"
      - "--pkey=/certs/turn.key"
      # fingerprint обязателен для WebRTC-клиентов.
      - "--fingerprint"
      - "--no-cli"
      - "--no-multicast-peers"
      - "--log-file=stdout"
