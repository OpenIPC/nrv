services:
  postgres:
    image: postgres:16-alpine
    # unless-stopped — поднимать контейнер при старте Docker и после сбоев,
    # но не запускать повторно, если он был остановлен вручную.
    restart: unless-stopped
    environment:
      POSTGRES_DB: nvr
      POSTGRES_USER: nvr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nvr_secret}
      # Часовой пояс сервера баз данных. Через переменную, а не только
      # монтированием файла: значение timezone записано в самом каталоге
      # данных, и для уже созданной базы оно перебило бы пояс из файла.
      # Значения времени при этом не меняются — они хранятся в UTC
      # и лишь показываются в поясе сессии.
      TZ: ${TZ:-Europe/Moscow}
      PGTZ: ${TZ:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Часовой пояс хоста: без него время сессии остаётся в UTC,
      # и SQL-функции возвращают время на несколько часов назад.
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvr"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO — S3-хранилище видеоархива. По умолчанию НЕ запускается.
  #
  # Публичные образы MinIO убраны из всех реестров (Docker Hub, quay.io,
  # ghcr.io отказывают на любой тег), поэтому поднять этот контейнер при
  # установке больше нельзя. Архив работает и без S3: снимки и записи
  # ложатся на локальный диск (том nvr_data ниже и режим "local" в
  # настройках сервера), а бэкенд выбирает диск сам, если MinIO не настроен.
  #
  # Сервис вынесен в профиль "minio" для тех, у кого хранилище уже есть:
  #   docker compose --profile minio up -d   + MINIO_ENDPOINT в .env
  # Без профиля compose не тянет этот образ и не падает на его скачивании.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # Asterisk — SIP-сервер домофонии: вызовы с панели в приложения и трубки.
  #
  # По умолчанию НЕ поднимается: он нужен только там, где есть вызывные
  # панели, видеодомофоны и SIP-трубки. Включается профилем:
  #   docker compose --profile sip up -d
  #
  # Почему 18-я ветка. Только в ней есть сразу оба драйвера SIP, а нужны оба:
  #   * chan_sip — старый. На нём работают панель Beward и видеодомофон
  #     Dahua: с новым драйвером они ведут себя некорректно (проверено на
  #     живом оборудовании). В 20-й и 22-й ветках chan_sip нет вовсе.
  #   * chan_pjsip — новый. Только он умеет SIP over WebSocket, а без этого
  #     не подключить приложения: браузер и телефоны ходят по WebRTC.
  asterisk:
    image: andrius/asterisk:18
    profiles: ["sip"]
    restart: unless-stopped
    # host-сеть нужна по той же причине, что и go2rtc: SIP и RTP должны быть
    # видны устройствам напрямую, а диапазон RTP — динамический, и пробрасывать
    # его через bridge пришлось бы сотней портов.
    network_mode: host
    volumes:
      # Часть конфигурации — наша (sip.conf, pjsip.conf, extensions.conf),
      # часть сервер генерирует в каталог accounts из своей базы. Поэтому
      # каталог монтируется на запись.
      - ./asterisk/config:/etc/asterisk
      # Часовой пояс: время в журнале звонков должно совпадать со временем
      # событий камер и СКУД, иначе разбирать происшествие неудобно.
      - /etc/localtime:/etc/localtime:ro

  # go2rtc — медиасервер: принимает потоки камер и отдаёт их браузеру
  # (WebRTC, MSE, HLS), а внешним системам — по RTSP.
  #
  # Заменил MediaMTX (см. plans/go2rtc-migration.md). Причины: двусторонний
  # звук из коробки (backchannel по RTSP), режим MSE, HTTP-кадры и, главное,
  # ленивость — соединение с камерой открывается только когда её смотрят.
  # MediaMTX держал все камеры постоянно и занимал под это ~90% процессора.
  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    # host-сеть нужна по двум причинам: камеры живут в локальной сети
    # (порт 554), а WebRTC должен предлагать браузеру адрес, доступный
    # напрямую, без NAT внутри docker.
    network_mode: host
    volumes:
      - ./go2rtc:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Пароль RTSP-сервера go2rtc — то, что оператор выдаёт внешним
      # системам (см. docs/EXTERNAL-RTSP.md).
      #
      # Для адресов localhost go2rtc проверку отключает сам: звук
      # (ffmpeg), бэкенд и внешние alias-источники ходят по 127.0.0.1 и
      # учётных данных не передают. Внешние системы приходят через
      # rtsp-proxy — это уже не localhost, и пароль с них спрашивается.
      # Без этих переменных порт 9784 был бы открыт всем в сети.
      RTSP_EXTERNAL_USER: ${EXTERNAL_RTSP_USER:-viewer}
      RTSP_EXTERNAL_PASS: ${EXTERNAL_RTSP_PASS:-viewer}
    # Учётные данные камер в конфиг не попадают: потоки регистрирует бэкенд
    # через API go2rtc, читая адреса из базы.

  # RTSP-прокси для внешних систем на отдельном порту.
  #
  # У go2rtc один RTSP-порт на всех, а внешним клиентам нужен
  # предсказуемый адрес из документации. nginx слушает 9784 и передаёт
  # поток на RTSP-порт go2rtc, не разбирая протокол: заголовок
  # Authorization от внешнего клиента доходит до go2rtc как есть, и
  # пароль проверяет сам go2rtc.
  rtsp-proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./rtsp-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9784:9784"
    # go2rtc работает в host-сети, поэтому из bridge-контейнера он виден
    # только по адресу хоста.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - go2rtc

  nats:
    image: nats:latest
    restart: unless-stopped
    command: "-js"
    ports:
      - "127.0.0.1:4222:4222"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # host-сеть нужна, чтобы бэкенд видел камеры в локальной сети
    # и мог обращаться к MediaMTX/Postgres/MinIO по localhost.
    network_mode: host
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://nvr:${DB_PASSWORD:-nvr_secret}@localhost:5434/nvr?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: "console"
      # Адрес S3-хранилища архива. Пусто — архив пишется на локальный диск
      # (том nvr_data). Пустое значение здесь нормально, а не ошибка
      # настройки: образ MinIO больше не публикуется, и диск — штатный
      # вариант хранения. Заполнять нужно только при внешнем S3.
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-}"
      # Адрес для presigned-ссылок, которые открывает браузер.
      # При доступе извне подставить внешний адрес сервера.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: "nvr-recordings"
      NATS_URL: "nats://localhost:4222"
      # Медиасервер go2rtc. API — регистрация и проверка потоков, RTSP —
      # откуда берётся звук камер для перекодирования.
      GO2RTC_API: "http://localhost:1984"
      GO2RTC_RTSP: "localhost:8554"
      # Адрес go2rtc, доступный браузеру оператора (подставляется в ссылки).
      # Нужен потому, что внутренний адрес docker-сети в браузере не
      # работает — он указывал бы на машину самого оператора. Пусто —
      # ссылки строятся по адресу запроса.
      GO2RTC_PUBLIC_HOST: "${GO2RTC_PUBLIC_HOST:-}"
      # Адрес этого сервера, доступный из сети устройств (камеры, контроллеры СКУД).
      #
      # Без него сервис подставляет localhost, и контроллер Z5R уходит
      # опрашивать сам себя: /stat показывал conn=127.0.0.1, команды до
      # сервера не доходили, а выдача базы карт зависала до таймаута.
      # Пусто здесь недопустимо — молчаливая подстановка неверного адреса
      # выглядит как исправная работа, пока не дойдёшь до записи карт.
      PUBLIC_URL: "${PUBLIC_URL:-}"
      # Учётные данные внешнего RTSP-доступа: страница настроек
      # показывает их оператору для настройки сторонних систем.
      # Имена переменных исторические (MTX_ — от прежнего медиасервера):
      # их читает external_rtsp_service.go, а менять имена нельзя без
      # правки окружения у уже установленных систем.
      EXTERNAL_RTSP_USER: ${EXTERNAL_RTSP_USER:-viewer}
      EXTERNAL_RTSP_PASS: ${EXTERNAL_RTSP_PASS:-viewer}
      # Приём логов с камер по syslog.
      #
      # Слушаем на всех интерфейсах: камеры стоят в разных подсетях,
      # и привязка к одному адресу отрезала бы часть из них.
      #
      # SYSLOG_ADVERTISE — адрес, который прописывается камерам. Пусто
      # означает «определить самому»: сервер берёт свой первый не-loopback
      # адрес. В типовой установке камеры и сервер в одной сети, поэтому
      # подставлять что-то руками не нужно.
      SYSLOG_LISTEN: "${SYSLOG_LISTEN:-:514}"
      SYSLOG_ADVERTISE: "${SYSLOG_ADVERTISE:-}"
      # Глубина хранения логов. Логи нужны для разбора свежих
      # происшествий, старая история только замедляет поиск.
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
      # SIP-домофония. Каталог конфигурации Asterisk монтируется ниже;
      # по нему сервер собирает абонентов и правила вызова из своей базы.
      #
      # Пусто — телефония не настроена, и сервер не трогает Asterisk.
      # Это штатное состояние установки без домофонии, а не забытая настройка:
      # конфигурацию правят только когда каталог подключён явно.
      ASTERISK_CONFIG_DIR: "${ASTERISK_CONFIG_DIR:-}"
      # Интерфейс управления Asterisk (AMI) — перезагрузка конфигурации
      # без разрыва идущих разговоров.
      ASTERISK_AMI_ADDR: "${ASTERISK_AMI_ADDR:-127.0.0.1:5038}"
      ASTERISK_AMI_USER: "${ASTERISK_AMI_USER:-nvr}"
      ASTERISK_AMI_SECRET: "${ASTERISK_AMI_SECRET:-}"
    volumes:
      # Локальное хранилище снимков и записей (режим "local" в настройках сервера).
      # Без этого тома файлы писались бы внутрь контейнера и терялись при
      # его пересоздании, а образ оставался бы «пухнуть».
      - nvr_data:/var/lib/nvr
      # Сокет агента управления хостом: через него бэкенд меняет часовой
      # пояс и настройки сети. Привилегий контейнеру не даём — за него
      # системные изменения выполняет отдельная служба на хосте.
      - /var/lib/nvr-agent/socket:/run/nvr-agent
      # Часовой пояс хоста. В образе нет /etc/localtime, поэтому время
      # процесса остаётся в UTC: сообщения оператору уходили бы на 3 часа
      # назад относительно времени сервера.
      - /etc/localtime:/etc/localtime:ro
      # Локальное время нужно некоторым библиотекам, которые читают его
      # не через системные вызовы, а из файла.
      - /etc/timezone:/etc/timezone:ro
      # Конфигурация Asterisk: туда сервер пишет accounts/*.conf, собранные
      # из своей базы. Тот же каталог смонтирован в контейнер Asterisk —
      # иначе Asterisk читал бы свои файлы, а сервер писал в пустой каталог
      # у себя, и правки из интерфейса ни на что не влияли бы.
      - ./asterisk/config:/etc/asterisk
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      go2rtc:
        condition: service_started

  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    extra_hosts:
      # Бэкенд слушает порт на хосте, а webui работает в bridge-сети —
      # так контейнер обращается к нему через host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      # Часовой пояс хоста: nginx пишет время в журнал доступа, и без
      # него записи шли бы в UTC — при разборе проблем это сбивает.
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend

  ai-detector:
    build:
      context: ./ai-detector
      dockerfile: Dockerfile
      # Вариант сборки: CPU (по умолчанию) или CUDA — см. .env и install.sh.
      #
      # Значения важны не только для скорости: CUDA-сборка torch вместе
      # с библиотеками NVIDIA занимает около 8 ГБ (против ~700 МБ у CPU),
      # и на сервере без видеокарты эти гигабайты бесполезны — на них
      # установка падала с «No space left on device».
      args:
        BASE_IMAGE: "${AI_BASE_IMAGE:-ubuntu:24.04}"
        TORCH_INDEX_URL: "${AI_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}"
    restart: unless-stopped
    environment:
      NATS_URL: "nats://nats:4222"
      # Детектор работает в bridge-сети compose, поэтому обращаемся к Postgres
      # по имени сервиса и внутреннему порту 5432 (не по localhost:5434).
      DATABASE_URL: "postgres://nvr:${DB_PASSWORD:-nvr_secret}@postgres:5432/nvr?sslmode=disable"
      MODEL_PATH: "yolov8n.pt"
      # Отключает проверку обновлений и телеметрию ultralytics (отправку
      # событий в Google Analytics). Признак читается библиотекой один раз
      # при импорте, поэтому значение пробрасывается в окружение.
      # Наш сервер может стоять в сети без интернета, а телеметрия ещё
      # и копила открытые соединения до исчерпания дескрипторов.
      YOLO_OFFLINE: "true"
      # 'cpu' — счёт на процессоре, 'cuda'/'0' — на видеокарте
      # (см. resolve_device в main.py: при отсутствии CUDA он честно
      # сообщает об этом в журнал и продолжает на процессоре).
      DEVICE: "${AI_DEVICE:-cpu}"
      CONFIDENCE: "0.25"
      # Трекинг объектов даёт track_id, но чувствителен к смене разрешения кадра.
      # TRACK=false отключает его — события продолжат сохраняться без track_id.
      TRACK: "${AI_TRACK:-true}"
      # Отправлять JPEG кадра вместе с событием (бэкенд сохранит как снимок)
      SEND_SNAPSHOT: "${AI_SEND_SNAPSHOT:-true}"
      # Брать снимок события из основного потока «по запросу» у публикатора
      # кадров. Кадры детекции идут из субпотока, поэтому без этого снимки
      # были бы 704×576. Публикатор отдаёт один кадр 1920 px на событие —
      # постоянной нагрузки нет.
      SNAPSHOT_FROM_PUBLISHER: "${AI_SNAPSHOT_FROM_PUBLISHER:-true}"
      SNAPSHOT_TIMEOUT: "${AI_SNAPSHOT_TIMEOUT:-6}"
      # Распознавание лиц и номеров. Модуль сам отключается, если модель
      # или библиотека недоступна, поэтому значения по умолчанию — true.
      ENABLE_FACE_RECOGNITION: "${AI_FACES:-true}"
      ENABLE_PLATE_RECOGNITION: "${AI_PLATES:-true}"
      PLATE_REGION: "${AI_PLATE_REGION:-ru}"
      # Пауза между распознаваниями номеров одной камеры на быстром потоке
      # зоны (кадры идут 5 раз в секунду). Одно распознавание стоит 0,2-0,6 с,
      # поэтому читать каждый кадр нельзя: очередь не разбиралась, и NATS
      # выбрасывал кадры. Меньше значение — больше попыток прочитать быструю
      # машину, больше значение — меньше нагрузка.
      PLATE_OCR_INTERVAL: "${AI_PLATE_OCR_INTERVAL:-0.5}"
      # Сколько обработчиков разбирает кадры зоны номеров. Три не хватало:
      # пока все три заняты распознаванием, из очереди никто не забирает
      # новые кадры, она растёт, и NATS выбрасывает самые старые. Воркеры,
      # которым кадр не нужен, лишь отбрасывают его — это дёшево, поэтому
      # лучше держать больше свободных.
      PLATE_WORKERS: "${AI_PLATE_WORKERS:-6}"
      # Нейросетевой детектор области номера. Файл весов лежит в томе
      # plate_models и скачивается при первом старте (PLATE_MODEL_URL),
      # если его там нет. Без файла детектор работает морфологией —
      # раньше она принимала доски паллета за номер.
      PLATE_DETECTOR_MODEL: "/app/models/plate_yolov8n.pt"
      PLATE_MODEL_URL: "${AI_PLATE_MODEL_URL:-https://huggingface.co/Koushim/yolov8-license-plate-detection/resolve/main/best.pt}"
      # Порог уверенности модели: ниже — больше находок и больше мусора.
      PLATE_MODEL_CONF: "${AI_PLATE_MODEL_CONF:-0.35}"
      # OCR номеров нейросетью. На живом проезде tesseract прочитал номер
      # как «TYAB5KK78», а эта модель — «Y185KK77» (верный — У185КК178).
      # Пустое значение возвращает старый путь на tesseract.
      PLATE_OCR_MODEL: "${AI_PLATE_OCR_MODEL:-european-plates-mobile-vit-v2-model}"
      # Детекция звука (YAMNet): выстрелы, крики, разбитое стекло и т.п.
      # Отключается, если нужен только видеоанализ — экономит CPU.
      ENABLE_AUDIO_DETECTION: "${AI_AUDIO:-true}"
      # Откуда брать звук: перекодированный AAC отдаёт сам go2rtc.
      # go2rtc работает в host-сети, поэтому из bridge-контейнера он виден
      # только по адресу хоста (см. extra_hosts ниже).
      #
      # Учётные данные здесь обязательны: для адресов кроме localhost
      # go2rtc требует пароль (тот же, что выдан внешним системам).
      GO2RTC_RTSP: "${EXTERNAL_RTSP_USER:-viewer}:${EXTERNAL_RTSP_PASS:-viewer}@host.docker.internal:8554"
    # Проброс видеокарты живёт не здесь, а в docker-compose.gpu.yml:
    # на машине без карты он не нужен, а указание драйвера nvidia роняло
    # запуск всего стека. Установщик сам создаёт docker-compose.override.yml,
    # если карта найдена.
    # Лимит дескрипторов. По умолчанию в контейнере 1024, и их хватает не
    # всегда: 24 камеры дают потоки видео и звука, соединения с NATS и
    # MediaMTX. Когда лимит кончается, отказывает всё сразу, а в журнале
    # видно только «Too many open files» на чтении звука — причину по нему
    # не найти. Значение с запасом перекрывает текущее потребление.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Проброс GPU через CDI (nvidia-container-toolkit уже настроен на хосте).
    # Работает только при наличии установленного драйвера NVIDIA на хосте.
    extra_hosts:
      # go2rtc живёт в host-сети, из этой сети он доступен только по адресу
      # хоста: имя сервиса не разрешается, потому что у go2rtc нет
      # собственного адреса в bridge-сети.
      - "host.docker.internal:host-gateway"
    volumes:
      # Часовой пояс хоста: детектор проставляет время событий сам,
      # и без этого файла оно уходило бы в UTC.
      - /etc/localtime:/etc/localtime:ro
      # Веса insightface (детекция лица и ArcFace, ~280 МБ). Без тома они
      # лежат в файловой системе контейнера и теряются при каждом
      # `docker compose up -d`: контейнер скачивает их заново, а на медленном
      # канале это часы. С томом загрузка происходит один раз.
      - insightface_models:/root/.insightface
      # Веса OCR номеров: тот же смысл, скачиваются один раз.
      - plate_ocr_cache:/root/.cache/fast-plate-ocr
      # Веса нейросетевого детектора номеров (~6 МБ). Тот же смысл: файл
      # скачивается один раз и не теряется при пересборке образа.
      - plate_models:/app/models
    depends_on:
      nats:
        condition: service_started
      go2rtc:
        condition: service_started

  # Тянет кадры из RTSP-субпотоков камер и публикует их в NATS для ai-detector.
  # Без него детектору нечего обрабатывать — цепочка детекции разорвана.
  frame-publisher:
    build:
      context: ./ai-detector
      dockerfile: Dockerfile.publisher
    restart: unless-stopped
    # host-сеть нужна, чтобы дотянуться до камер в локальной сети (порт 554),
    # как это делает backend.
    network_mode: host
    environment:
      DATABASE_URL: "postgres://nvr:${DB_PASSWORD:-nvr_secret}@localhost:5434/nvr?sslmode=disable"
      NATS_URL: "nats://localhost:4222"
      # Период опроса каждой камеры, сек
      FRAME_INTERVAL: "${FRAME_INTERVAL:-1.0}"
      # Источник кадров для детекции: sub — дополнительный поток
      # (704×576, декодируется в разы дешевле), main — основной
      # (1920×1080 и выше). Детекция идёт из субпотока: на 24 камерах
      # основной поток занимал почти 14 ядер процессора, тогда как
      # видеокарта простаивала. Качество снимка события при этом не
      # страдает — кадр основного потока берётся отдельно и только на
      # время события (SNAPSHOT_*).
      DETECT_SOURCE_STREAM: "${AI_DETECT_SOURCE:-sub}"
      # Ширина кадра детекции. 0 — без ресайза: субпоток камер парка и так
      # 704×576, растягивать его незачем, а исходный размер виден в
      # метаданных события и нужен для наложения рамок.
      FRAME_WIDTH: "${FRAME_WIDTH:-0}"
      CAMERA_RELOAD: "60"
      FFMPEG_TIMEOUT: "10"
      # Снимки событий «по запросу» из основного потока. 1920 — снимок
      # читаемый (на 4К-камере это ресайз, а не обрезка: пропорции целы).
      SNAPSHOT_WIDTH: "${AI_SNAPSHOT_WIDTH:-1920}"
      # Сколько снимков берётся одновременно. Всплеск событий иначе
      # выбивает процессор: несколько одновременных декодирований 4К.
      SNAPSHOT_PARALLEL: "${AI_SNAPSHOT_PARALLEL:-3}"
      SNAPSHOT_TIMEOUT: "${AI_SNAPSHOT_TIMEOUT:-6}"
      # Быстрый поток кадров зоны номера: 2,5 кадра в секунду.
      # Нужен потому, что машина проезжает зону за 2-3 секунды, а обычный
      # поток идёт раз в секунду — поймать её в кадре иначе не удаётся.
      #
      # Было 5 кадров в секунду (0.2). Оказалось вредно: детектор физически
      # не может читать такой поток. Одно распознавание номера стоит 0,2-0,6 с
      # (замерено), четыре камеры давали 20 кадров в секунду при пропускной
      # способности около двух, и NATS выбрасывал всё лишнее как slow consumer.
      # Лишние кадры бесполезны ещё и по существу: номер виден на нескольких
      # кадрах подряд, достаточно свежего.
      PLATE_FRAME_INTERVAL: "${PLATE_FRAME_INTERVAL:-0.4}"
      PLATE_FRAME_WIDTH: "${PLATE_FRAME_WIDTH:-640}"
      # Источник кадров для номеров: sub — дополнительный поток (дешевле,
      # но номер мелкий), main — основной поток. Камера .87 снимает дорогу
      # издалека: в субпотоке номер занимает ~25 px и OCR читать нечего,
      # в основном потоке — около 120 px, и номер читается.
      PLATE_SOURCE_STREAM: "${AI_PLATE_SOURCE:-main}"
      # Ширина кадра номеров из основного потока. 0 — без уменьшения:
      # уменьшение до сотен пикселей снова делает номер нечитаемым.
      PLATE_FRAME_WIDTH_MAIN: "${AI_PLATE_WIDTH_MAIN:-0}"
    volumes:
      # Часовой пояс хоста: в журналах и метках кадров нужен местный
      # время, а не UTC.
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  pgdata:
  minio_data:
  # Веса распознавания лиц: качаются из сети один раз и переживают
  # пересоздание контейнера детектора.
  insightface_models:
  # Веса детектора номеров: тот же смысл — файл скачивается один раз.
  plate_models:
  # Веса OCR номеров (fast-plate-ocr): кэш моделей.
  plate_ocr_cache:
  # Локальные снимки и записи (при backend: local в настройках сервера)
  nvr_data: