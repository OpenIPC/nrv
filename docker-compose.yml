services:
  postgres:
    image: postgres:16-alpine
    # unless-stopped — поднимать контейнер при старте Docker и после сбоев,
    # но не запускать повторно, если он был остановлен вручную.
    restart: unless-stopped
    environment:
      POSTGRES_DB: nvr
      POSTGRES_USER: nvr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nvr_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvr"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    environment:
      # Учётные данные для внешнего RTSP-доступа (порт 9784).
      # Подставляются в mediamtx.yml при старте.
      MTX_EXTERNAL_USER: ${MTX_EXTERNAL_USER:-viewer}
      MTX_EXTERNAL_PASS: ${MTX_EXTERNAL_PASS:-viewer}
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC: обмен SDP (WHEP)
      # UDP-порт, по которому идёт сам медиапоток WebRTC. Без него
      # соединение не устанавливается: сигнальный обмен по 8889 проходит,
      # а данные передавать некуда, и сессия закрывается по таймауту
      # с сообщением «deadline exceeded while waiting connection».
      - "8189:8189/udp"
      - "8888:8888"   # HLS
      - "9997:9997"   # API управления

  # RTSP-прокси для внешних систем на отдельном порту.
  #
  # MediaMTX поддерживает только один RTSP-порт, а внешним клиентам
  # нужен предсказуемый адрес из документации. nginx слушает 9784 и
  # передаёт поток на RTSP-порт MediaMTX, не разбирая протокол.
  rtsp-proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./rtsp-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9784:9784"
    depends_on:
      - mediamtx

  nats:
    image: nats:latest
    restart: unless-stopped
    command: "-js"
    ports:
      - "127.0.0.1:4222:4222"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # host-сеть нужна, чтобы бэкенд видел камеры в локальной сети
    # и мог обращаться к MediaMTX/Postgres/MinIO по localhost.
    network_mode: host
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://nvr:${DB_PASSWORD:-nvr_secret}@localhost:5434/nvr?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: "console"
      MINIO_ENDPOINT: "localhost:9000"
      # Адрес для presigned-ссылок, которые открывает браузер.
      # При доступе извне подставить внешний адрес сервера.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: "nvr-recordings"
      NATS_URL: "nats://localhost:4222"
      MEDIAMTX_HOST: "localhost:8888"
      # Адрес MediaMTX, по которому до него дойдёт браузер. Используется
      # в ссылках на WebRTC: внутренний адрес docker-сети в браузере не
      # работает — он указывал бы на машину самого оператора.
      MEDIAMTX_PUBLIC_HOST: "${MEDIAMTX_PUBLIC_HOST:-83.243.73.86}"
      # Учётные данные внешнего RTSP-доступа: страница настроек
      # показывает их оператору для настройки сторонних систем.
      # Должны совпадать со значениями в mediamtx.yml.
      MTX_EXTERNAL_USER: ${MTX_EXTERNAL_USER:-viewer}
      MTX_EXTERNAL_PASS: ${MTX_EXTERNAL_PASS:-viewer}
    volumes:
      # Локальное хранилище снимков и записей (режим "local" в настройках сервера).
      # Без этого тома файлы писались бы внутрь контейнера и терялись при
      # его пересоздании, а образ оставался бы «пухнуть».
      - nvr_data:/var/lib/nvr
      # Сокет агента управления хостом: через него бэкенд меняет часовой
      # пояс и настройки сети. Привилегий контейнеру не даём — за него
      # системные изменения выполняет отдельная служба на хосте.
      - /var/lib/nvr-agent/socket:/run/nvr-agent
      # Часовой пояс хоста только для чтения: при старте бэкенд берёт его
      # отсюда, чтобы календарь архива сразу группировал дни по местному
      # времени, а не по UTC.
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      mediamtx:
        condition: service_started

  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    extra_hosts:
      # Бэкенд слушает порт на хосте, а webui работает в bridge-сети —
      # так контейнер обращается к нему через host.docker.internal.
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  ai-detector:
    build:
      context: ./ai-detector
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL: "nats://nats:4222"
      # Детектор работает в bridge-сети compose, поэтому обращаемся к Postgres
      # по имени сервиса и внутреннему порту 5432 (не по localhost:5434).
      DATABASE_URL: "postgres://nvr:${DB_PASSWORD:-nvr_secret}@postgres:5432/nvr?sslmode=disable"
      MODEL_PATH: "yolov8n.pt"
      # 'cuda'/'0' — GPU, 'cpu' — только CPU (см. resolve_device в main.py)
      DEVICE: "${AI_DEVICE:-cuda}"
      CONFIDENCE: "0.25"
      # Трекинг объектов даёт track_id, но чувствителен к смене разрешения кадра.
      # TRACK=false отключает его — события продолжат сохраняться без track_id.
      TRACK: "${AI_TRACK:-true}"
      # Отправлять JPEG кадра вместе с событием (бэкенд сохранит как снимок)
      SEND_SNAPSHOT: "${AI_SEND_SNAPSHOT:-true}"
      # Распознавание лиц и номеров. Модуль сам отключается, если модель
      # или библиотека недоступна, поэтому значения по умолчанию — true.
      ENABLE_FACE_RECOGNITION: "${AI_FACES:-true}"
      ENABLE_PLATE_RECOGNITION: "${AI_PLATES:-true}"
      PLATE_REGION: "${AI_PLATE_REGION:-ru}"
      # Детекция звука (YAMNet): выстрелы, крики, разбитое стекло и т.п.
      # Отключается, если нужен только видеоанализ — экономит CPU.
      ENABLE_AUDIO_DETECTION: "${AI_AUDIO:-true}"
      # Откуда брать звук: транскодированный AAC лежит в MediaMTX.
      # Имя сервиса в compose-сети, а не localhost.
      MEDIAMTX_RTSP: "mediamtx:8554"
      # Ограничиваем видимость только первой GPU
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
    # Проброс GPU через CDI (nvidia-container-toolkit уже настроен на хосте).
    # Работает только при наличии установленного драйвера NVIDIA на хосте.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      nats:
        condition: service_started
      mediamtx:
        condition: service_started

  # Тянет кадры из RTSP-субпотоков камер и публикует их в NATS для ai-detector.
  # Без него детектору нечего обрабатывать — цепочка детекции разорвана.
  frame-publisher:
    build:
      context: ./ai-detector
      dockerfile: Dockerfile.publisher
    restart: unless-stopped
    # host-сеть нужна, чтобы дотянуться до камер в локальной сети (порт 554),
    # как это делает backend.
    network_mode: host
    environment:
      DATABASE_URL: "postgres://nvr:${DB_PASSWORD:-nvr_secret}@localhost:5434/nvr?sslmode=disable"
      NATS_URL: "nats://localhost:4222"
      # Период опроса каждой камеры, сек
      FRAME_INTERVAL: "${FRAME_INTERVAL:-1.0}"
      # Ширина кадра для детекции (0 — без ресайза)
      FRAME_WIDTH: "${FRAME_WIDTH:-960}"
      CAMERA_RELOAD: "60"
      FFMPEG_TIMEOUT: "10"
      # Быстрый поток кадров зоны номера: 5 кадров в секунду.
      # Нужен потому, что машина проезжает зону за 2-3 секунды, а обычный
      # поток идёт раз в секунду — поймать её в кадре иначе не удаётся.
      PLATE_FRAME_INTERVAL: "${PLATE_FRAME_INTERVAL:-0.2}"
      PLATE_FRAME_WIDTH: "${PLATE_FRAME_WIDTH:-640}"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  pgdata:
  minio_data:
  # Локальные снимки и записи (при backend: local в настройках сервера)
  nvr_data: