services:
  postgres:
    image: postgres:16-alpine
    # unless-stopped — поднимать контейнер при старте Docker и после сбоев,
    # но не запускать повторно, если он был остановлен вручную.
    restart: unless-stopped
    environment:
      POSTGRES_DB: nvr
      POSTGRES_USER: nvr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nvr_secret}
      # Часовой пояс сервера баз данных. Через переменную, а не только
      # монтированием файла: значение timezone записано в самом каталоге
      # данных, и для уже созданной базы оно перебило бы пояс из файла.
      # Значения времени при этом не меняются — они хранятся в UTC
      # и лишь показываются в поясе сессии.
      TZ: ${TZ:-Europe/Moscow}
      PGTZ: ${TZ:-Europe/Moscow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Часовой пояс хоста: без него время сессии остаётся в UTC,
      # и SQL-функции возвращают время на несколько часов назад.
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nvr"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    environment:
      # Учётные данные для внешнего RTSP-доступа (порт 9784).
      # Подставляются в mediamtx.yml при старте.
      MTX_EXTERNAL_USER: ${MTX_EXTERNAL_USER:-viewer}
      MTX_EXTERNAL_PASS: ${MTX_EXTERNAL_PASS:-viewer}
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC: обмен SDP (WHEP)
      # UDP-порт, по которому идёт сам медиапоток WebRTC. Без него
      # соединение не устанавливается: сигнальный обмен по 8889 проходит,
      # а данные передавать некуда, и сессия закрывается по таймауту
      # с сообщением «deadline exceeded while waiting connection».
      - "8189:8189/udp"
      - "8888:8888"   # HLS
      - "9997:9997"   # API управления

  # RTSP-прокси для внешних систем на отдельном порту.
  #
  # MediaMTX поддерживает только один RTSP-порт, а внешним клиентам
  # нужен предсказуемый адрес из документации. nginx слушает 9784 и
  # передаёт поток на RTSP-порт MediaMTX, не разбирая протокол.
  rtsp-proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./rtsp-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9784:9784"
    depends_on:
      - mediamtx

  nats:
    image: nats:latest
    restart: unless-stopped
    command: "-js"
    ports:
      - "127.0.0.1:4222:4222"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # host-сеть нужна, чтобы бэкенд видел камеры в локальной сети
    # и мог обращаться к MediaMTX/Postgres/MinIO по localhost.
    network_mode: host
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://nvr:${DB_PASSWORD:-nvr_secret}@localhost:5434/nvr?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: "console"
      MINIO_ENDPOINT: "localhost:9000"
      # Адрес для presigned-ссылок, которые открывает браузер.
      # При доступе извне подставить внешний адрес сервера.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: "nvr-recordings"
      NATS_URL: "nats://localhost:4222"
      MEDIAMTX_HOST: "localhost:8888"
      # Адрес MediaMTX, по которому до него дойдёт браузер. Используется
      # в ссылках на WebRTC: внутренний адрес docker-сети в браузере не
      # работает — он указывал бы на машину самого оператора.
      MEDIAMTX_PUBLIC_HOST: "${MEDIAMTX_PUBLIC_HOST:-83.243.73.86}"
      # Адрес этого сервера, доступный из сети устройств (камеры, контроллеры СКУД).
      #
      # Без него сервис подставляет localhost, и контроллер Z5R уходит
      # опрашивать сам себя: /stat показывал conn=127.0.0.1, команды до
      # сервера не доходили, а выдача базы карт зависала до таймаута.
      # Пусто здесь недопустимо — молчаливая подстановка неверного адреса
      # выглядит как исправная работа, пока не дойдёшь до записи карт.
      PUBLIC_URL: "${PUBLIC_URL:-}"
      # Учётные данные внешнего RTSP-доступа: страница настроек
      # показывает их оператору для настройки сторонних систем.
      # Должны совпадать со значениями в mediamtx.yml.
      MTX_EXTERNAL_USER: ${MTX_EXTERNAL_USER:-viewer}
      MTX_EXTERNAL_PASS: ${MTX_EXTERNAL_PASS:-viewer}
      # Приём логов с камер по syslog.
      #
      # Слушаем на всех интерфейсах: камеры стоят в разных подсетях,
      # и привязка к одному адресу отрезала бы часть из них.
      #
      # SYSLOG_ADVERTISE — адрес, который прописывается камерам. Пусто
      # означает «определить самому»: сервер берёт свой первый не-loopback
      # адрес. В типовой установке камеры и сервер в одной сети, поэтому
      # подставлять что-то руками не нужно.
      SYSLOG_LISTEN: "${SYSLOG_LISTEN:-:514}"
      SYSLOG_ADVERTISE: "${SYSLOG_ADVERTISE:-}"
      # Глубина хранения логов. Логи нужны для разбора свежих
      # происшествий, старая история только замедляет поиск.
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
    volumes:
      # Локальное хранилище снимков и записей (режим "local" в настройках сервера).
      # Без этого тома файлы писались бы внутрь контейнера и терялись при
      # его пересоздании, а образ оставался бы «пухнуть».
      - nvr_data:/var/lib/nvr
      # Сокет агента управления хостом: через него бэкенд меняет часовой
      # пояс и настройки сети. Привилегий контейнеру не даём — за него
      # системные изменения выполняет отдельная служба на хосте.
      - /var/lib/nvr-agent/socket:/run/nvr-agent
      # Часовой пояс хоста. В образе нет /etc/localtime, поэтому время
      # процесса остаётся в UTC: сообщения оператору уходили бы на 3 часа
      # назад относительно времени сервера.
      - /etc/localtime:/etc/localtime:ro
      # Локальное время нужно некоторым библиотекам, которые читают его
      # не через системные вызовы, а из файла.
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      mediamtx:
        condition: service_started

  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    extra_hosts:
      # Бэкенд слушает порт на хосте, а webui работает в bridge-сети —
      # так контейнер обращается к нему через host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      # Часовой пояс хоста: nginx пишет время в журнал доступа, и без
      # него записи шли бы в UTC — при разборе проблем это сбивает.
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend

  ai-detector:
    build:
      context: ./ai-detector
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NATS_URL: "nats://nats:4222"
      # Детектор работает в bridge-сети compose, поэтому обращаемся к Postgres
      # по имени сервиса и внутреннему порту 5432 (не по localhost:5434).
      DATABASE_URL: "postgres://nvr:${DB_PASSWORD:-nvr_secret}@postgres:5432/nvr?sslmode=disable"
      MODEL_PATH: "yolov8n.pt"
      # Отключает проверку обновлений и телеметрию ultralytics (отправку
      # событий в Google Analytics). Признак читается библиотекой один раз
      # при импорте, поэтому значение пробрасывается в окружение.
      # Наш сервер может стоять в сети без интернета, а телеметрия ещё
      # и копила открытые соединения до исчерпания дескрипторов.
      YOLO_OFFLINE: "true"
      # 'cuda'/'0' — GPU, 'cpu' — только CPU (см. resolve_device в main.py)
      DEVICE: "${AI_DEVICE:-cuda}"
      CONFIDENCE: "0.25"
      # Трекинг объектов даёт track_id, но чувствителен к смене разрешения кадра.
      # TRACK=false отключает его — события продолжат сохраняться без track_id.
      TRACK: "${AI_TRACK:-true}"
      # Отправлять JPEG кадра вместе с событием (бэкенд сохранит как снимок)
      SEND_SNAPSHOT: "${AI_SEND_SNAPSHOT:-true}"
      # Распознавание лиц и номеров. Модуль сам отключается, если модель
      # или библиотека недоступна, поэтому значения по умолчанию — true.
      ENABLE_FACE_RECOGNITION: "${AI_FACES:-true}"
      ENABLE_PLATE_RECOGNITION: "${AI_PLATES:-true}"
      PLATE_REGION: "${AI_PLATE_REGION:-ru}"
      # Пауза между распознаваниями номеров одной камеры на быстром потоке
      # зоны (кадры идут 5 раз в секунду). Одно распознавание стоит 0,2-0,6 с,
      # поэтому читать каждый кадр нельзя: очередь не разбиралась, и NATS
      # выбрасывал кадры. Меньше значение — больше попыток прочитать быструю
      # машину, больше значение — меньше нагрузка.
      PLATE_OCR_INTERVAL: "${AI_PLATE_OCR_INTERVAL:-0.5}"
      # Сколько обработчиков разбирает кадры зоны номеров. Три не хватало:
      # пока все три заняты распознаванием, из очереди никто не забирает
      # новые кадры, она растёт, и NATS выбрасывает самые старые. Воркеры,
      # которым кадр не нужен, лишь отбрасывают его — это дёшево, поэтому
      # лучше держать больше свободных.
      PLATE_WORKERS: "${AI_PLATE_WORKERS:-6}"
      # Нейросетевой детектор области номера. Файл весов лежит в томе
      # plate_models и скачивается при первом старте (PLATE_MODEL_URL),
      # если его там нет. Без файла детектор работает морфологией —
      # раньше она принимала доски паллета за номер.
      PLATE_DETECTOR_MODEL: "/app/models/plate_yolov8n.pt"
      PLATE_MODEL_URL: "${AI_PLATE_MODEL_URL:-https://huggingface.co/Koushim/yolov8-license-plate-detection/resolve/main/best.pt}"
      # Порог уверенности модели: ниже — больше находок и больше мусора.
      PLATE_MODEL_CONF: "${AI_PLATE_MODEL_CONF:-0.35}"
      # OCR номеров нейросетью. На живом проезде tesseract прочитал номер
      # как «TYAB5KK78», а эта модель — «Y185KK77» (верный — У185КК178).
      # Пустое значение возвращает старый путь на tesseract.
      PLATE_OCR_MODEL: "${AI_PLATE_OCR_MODEL:-european-plates-mobile-vit-v2-model}"
      # Детекция звука (YAMNet): выстрелы, крики, разбитое стекло и т.п.
      # Отключается, если нужен только видеоанализ — экономит CPU.
      ENABLE_AUDIO_DETECTION: "${AI_AUDIO:-true}"
      # Откуда брать звук: транскодированный AAC лежит в MediaMTX.
      # Имя сервиса в compose-сети, а не localhost.
      MEDIAMTX_RTSP: "mediamtx:8554"
      # Ограничиваем видимость только первой GPU
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video"
    # Лимит дескрипторов. По умолчанию в контейнере 1024, и их хватает не
    # всегда: 24 камеры дают потоки видео и звука, соединения с NATS и
    # MediaMTX. Когда лимит кончается, отказывает всё сразу, а в журнале
    # видно только «Too many open files» на чтении звука — причину по нему
    # не найти. Значение с запасом перекрывает текущее потребление.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Проброс GPU через CDI (nvidia-container-toolkit уже настроен на хосте).
    # Работает только при наличии установленного драйвера NVIDIA на хосте.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Часовой пояс хоста: детектор проставляет время событий сам,
      # и без этого файла оно уходило бы в UTC.
      - /etc/localtime:/etc/localtime:ro
      # Веса insightface (детекция лица и ArcFace, ~280 МБ). Без тома они
      # лежат в файловой системе контейнера и теряются при каждом
      # `docker compose up -d`: контейнер скачивает их заново, а на медленном
      # канале это часы. С томом загрузка происходит один раз.
      - insightface_models:/root/.insightface
      # Веса OCR номеров: тот же смысл, скачиваются один раз.
      - plate_ocr_cache:/root/.cache/fast-plate-ocr
      # Веса нейросетевого детектора номеров (~6 МБ). Тот же смысл: файл
      # скачивается один раз и не теряется при пересборке образа.
      - plate_models:/app/models
    depends_on:
      nats:
        condition: service_started
      mediamtx:
        condition: service_started

  # Тянет кадры из RTSP-субпотоков камер и публикует их в NATS для ai-detector.
  # Без него детектору нечего обрабатывать — цепочка детекции разорвана.
  frame-publisher:
    build:
      context: ./ai-detector
      dockerfile: Dockerfile.publisher
    restart: unless-stopped
    # host-сеть нужна, чтобы дотянуться до камер в локальной сети (порт 554),
    # как это делает backend.
    network_mode: host
    environment:
      DATABASE_URL: "postgres://nvr:${DB_PASSWORD:-nvr_secret}@localhost:5434/nvr?sslmode=disable"
      NATS_URL: "nats://localhost:4222"
      # Период опроса каждой камеры, сек
      FRAME_INTERVAL: "${FRAME_INTERVAL:-1.0}"
      # Ширина кадра для детекции (0 — без ресайза)
      FRAME_WIDTH: "${FRAME_WIDTH:-960}"
      CAMERA_RELOAD: "60"
      FFMPEG_TIMEOUT: "10"
      # Быстрый поток кадров зоны номера: 2,5 кадра в секунду.
      # Нужен потому, что машина проезжает зону за 2-3 секунды, а обычный
      # поток идёт раз в секунду — поймать её в кадре иначе не удаётся.
      #
      # Было 5 кадров в секунду (0.2). Оказалось вредно: детектор физически
      # не может читать такой поток. Одно распознавание номера стоит 0,2-0,6 с
      # (замерено), четыре камеры давали 20 кадров в секунду при пропускной
      # способности около двух, и NATS выбрасывал всё лишнее как slow consumer.
      # Лишние кадры бесполезны ещё и по существу: номер виден на нескольких
      # кадрах подряд, достаточно свежего.
      PLATE_FRAME_INTERVAL: "${PLATE_FRAME_INTERVAL:-0.4}"
      PLATE_FRAME_WIDTH: "${PLATE_FRAME_WIDTH:-640}"
      # Источник кадров для номеров: sub — дополнительный поток (дешевле,
      # но номер мелкий), main — основной поток. Камера .87 снимает дорогу
      # издалека: в субпотоке номер занимает ~25 px и OCR читать нечего,
      # в основном потоке — около 120 px, и номер читается.
      PLATE_SOURCE_STREAM: "${AI_PLATE_SOURCE:-main}"
      # Ширина кадра номеров из основного потока. 0 — без уменьшения:
      # уменьшение до сотен пикселей снова делает номер нечитаемым.
      PLATE_FRAME_WIDTH_MAIN: "${AI_PLATE_WIDTH_MAIN:-0}"
    volumes:
      # Часовой пояс хоста: в журналах и метках кадров нужен местный
      # время, а не UTC.
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  pgdata:
  minio_data:
  # Веса распознавания лиц: качаются из сети один раз и переживают
  # пересоздание контейнера детектора.
  insightface_models:
  # Веса детектора номеров: тот же смысл — файл скачивается один раз.
  plate_models:
  # Веса OCR номеров (fast-plate-ocr): кэш моделей.
  plate_ocr_cache:
  # Локальные снимки и записи (при backend: local в настройках сервера)
  nvr_data: