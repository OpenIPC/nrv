# Веб-интерфейс по HTTPS.
#
# Зачем отдельный прокси. Сама панель отдаётся обычным HTTP на порт 3001, а
# через интернет так нельзя: пароль пошёл бы открытым текстом, и, что важнее,
# браузер запрещает микрофон на незащищённом соединении — разговор через
# камеру в панели не работал бы вовсе.
#
# Сертификат берём тот же, что у TURN-сервера (turn/certs). Он выписан на
# домен установки, поэтому подходит и для панели: клиент проверяет имя, к
# которому подключается, а не то, кто именно отвечает.

# Переменная для WebSocket: без неё nginx не поднимает соединение, и живые
# уведомления, журнал и чат в панели отваливаются.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Имя не проверяем: сертификат на установке один, а обращаться к панели
    # можно и по домену, и по адресу.
    server_name _;

    ssl_certificate     /certs/turn.crt;
    ssl_certificate_key /certs/turn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    location / {
        # Панель отдаёт и статику, и API, и поток кадров: свой nginx внутри
        # webui уже проксирует /api, /mse и /ws, поэтому здесь достаточно
        # одного адреса.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Долгие соединения: живой просмотр камер идёт часами, и обрыв по
        # таймауту выглядел бы как «пропал поток».
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
