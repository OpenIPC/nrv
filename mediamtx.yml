api: yes
apiAddress: :9997
rtsp: yes
rtspAddress: :8554
# Учётные данные применяются ко всем RTSP-подключениям. Внутренние
# потребители (бэкенд, ai-detector) ходят на 8554 и не передают пароль —
# для них в списке ниже есть безымянный пользователь `any`.
# Внешние системы работают со своими учётными данными и правом только
# на чтение: публиковать в наши пути и менять конфигурацию они не могут.
authInternalUsers:
  # Внутренний доступ: без пароля. Ограничен локальной сетью.
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: read
      - action: publish
      - action: playback
  # Внешний доступ: только чтение. Права намеренно не включают publish
  # и api — внешняя система не должна ни публиковать в наши пути, ни
  # менять конфигурацию сервера.
  #
  # Значения подставляются из окружения: хранить пароль в файле
  # конфигурации рядом с репозиторием небезопасно.
  - user: ${MTX_EXTERNAL_USER}
    pass: ${MTX_EXTERNAL_PASS}
    ips: []
    permissions:
      - action: read
hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
# fmp4 (а не mpegts) — устойчив к B-кадрам и потерям пакетов с камер.
hlsVariant: fmp4
hlsAlwaysRemux: true
# Сегмент 1s + hlsAlwaysRemux одно время заставляли муксер пересоздаваться
# каждую секунду и падать с «unable to extract DTS: too many reordered
# frames». 2s тогда выбрали как безопасный компромисс.
#
# Причина была в B-кадрах: их порядок муксер не успевал перестраивать.
# Проверка камер показала, что все они отдают поток без B-кадров
# (has_b_frames=0), поэтому секундный сегмент работает устойчиво.
# Если камеру заменят на модель с B-кадрами и появится эта ошибка,
# значение нужно будет вернуть к 2s.
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
# Три сегмента по секунде — около трёх секунд буфера.
#
# Было 12 сегментов по 2 секунды, то есть 24 секунды. Вместе с буфером
# плеера это давало задержку около 40 секунд, из-за чего «живой» просмотр
# терял смысл: на экране было то, что случилось минуту назад.
#
# Раньше большое окно требовалось из-за звука: он стартовал на несколько
# секунд позже видео, и при малом окне плеер запрашивал уже удалённые
# сегменты, получал 404 и звук не начинал играть. Сейчас звук идёт
# отдельным потоком (<cameraID>_audio), поэтому видео-окно можно
# уменьшать независимо от него.
hlsSegmentCount: 3
# Плейлист считается готовым после накопления сегментов; 0 = отдавать сразу,
# не дожидаясь заполнения всего окна (иначе первый запрос висит).
hlsMuxerCloseAfter: 60s

# WebRTC: просмотр с задержкой меньше секунды.
#
# HLS по своей природе не может быть быстрее длины сегмента: плеер ждёт,
# пока сегмент сформируется целиком. Даже при секундном сегменте задержка
# складывается из буфера MediaMTX, буфера плеера и задержки самой камеры —
# на практике это около 6-8 секунд, а на камерах с медленным потоком до 20.
#
# WebRTC передаёт поток пакетами без сегментации, поэтому его задержка
# определяется только сетью и составляет доли секунды. Для живого
# просмотра это правильный выбор; HLS остаётся как запасной вариант для
# браузеров без поддержки WebRTC и для мобильных клиентов, которым
# удобнее обычный поток.
webrtc: true
webrtcAddress: :8889
# Какие адреса MediaMTX предлагает браузеру для подключения.
#
# В список обязательно должен входить адрес, по которому до сервера
# дойдёт клиент. Один только внешний IP не годится: если оператор
# открывает интерфейс изнутри сети, браузер получит недостижимый для
# него адрес и соединение не установится — в логе будет
# «deadline exceeded while waiting connection».
#
# Поэтому перечисляем оба адреса: внешний для доступа из интернета и
# локальный для работы внутри сети. Браузер сам выберет доступный.
webrtcAdditionalHosts: ["83.243.73.86", "192.168.1.111", "127.0.0.1"]

# Порт, по которому идёт сам медиапоток WebRTC.
#
# Через 8889 проходит только обмен SDP-описаниями; видео и звук идут
# сюда, по UDP. Порт должен быть открыт наружу — иначе сессия создаётся,
# но данные не передаются, и она закрывается по таймауту.
webrtcLocalUDPAddress: :8189

# Пути камер регистрируются автоматически бэкендом через API
# (POST /v3/config/paths/add/{uuid}) и удаляются при удалении камеры.
#
# Шаблон `~^.*$` разрешает публикацию в любой путь, которого нет в конфиге.
# Это нужно для звука: транскодированный AAC публикуется обратно в MediaMTX
# в путь <cameraID>_audio, создаваемый на лету. Без шаблона RTSP-сервер
# отвечает «path is not configured» и публикация отклоняется.
paths:
  # Шаблон для путей приёма публикации: транскодированный звук ffmpeg
  # отдаёт обратно в MediaMTX в путь <cameraID>_audio, который создаётся
  # на лету. Без такого пути RTSP-сервер отвечает «path is not configured»
  # и публикация отклоняется.
  #
  # Шаблон намеренно узкий — только суффикс `_audio`. Раньше здесь стояло
  # `~^.*$`, и оно перехватывало ЛЮБОЙ незарегистрированный путь, включая
  # псевдонимы для внешних RTSP-клиентов: MediaMTX считал псевдоним
  # приёмником публикации и удалял его, поэтому прочитать поток по нему
  # было нельзя.
  "~^[0-9a-f-]{36}_audio$":
    # Публикация разрешена: ffmpeg отдаёт звук обратно в MediaMTX.
    source: publisher
    # Перезапуск публикации разрешён без остановки сервиса: ffmpeg
    # переподключается при обрыве связи с камерой.
    overridePublisher: true
