# RTSP-прокси для внешних систем.
#
# Зачем отдельный nginx: у go2rtc один RTSP-порт на всех — и на внутренних
# потребителей, и на внешние системы. Требования к внешним клиентам
# (отдельный адрес из документации) удобнее держать в стороне от основного
# порта, поэтому внешний доступ идёт через 9784.
#
# Именно stream (а не http): RTSP — это отдельный протокол, nginx передаёт
# его потоком байт, не разбирая содержимое.

events {
    worker_connections 1024;
}

stream {
    # rtmp-подобная буферизация не нужна: поток передаётся как есть,
    # задержка не растёт.
    proxy_connect_timeout 10s;
    proxy_timeout 1h;
    proxy_buffer_size 16k;

    # Журнал подключений нужен для разбора «видео не идёт»: без него не
    # видно даже того, дошёл ли клиент до прокси. Строка появляется, когда
    # внешний клиент подключился; если её нет — проблема не в медиасервере,
    # а в адресе, который клиент себе взял (см. media/host в настройках
    # клиента).
    log_format rtsp '$remote_addr:$remote_port -> $server_addr:$server_port '
                     'status=$status bytes_sent=$bytes_sent '
                     'session=$session_time';
    access_log /dev/stdout rtsp;

    server {
        listen 9784;
        # go2rtc работает в host-сети, из этого контейнера он виден
        # только по адресу хоста (см. extra_hosts в docker-compose.yml).
        proxy_pass host.docker.internal:8554;
    }
}
