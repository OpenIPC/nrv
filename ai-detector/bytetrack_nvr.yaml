# Настройки трекера BYTETracker под наш конвейер.
#
# Файл отличается от стандартного bytetrack.yaml из ultralytics, и вот почему.
#
# Стандартные пороги (track_high_thresh 0.5, new_track_thresh 0.6) рассчитаны
# на детектор с порогом уверенности около 0.5. У нас CONFIDENCE=0.25, а порог
# на камеру (min_confidence) бывает и 0.3. Замер по базе за 3 дня: из 4338
# детекций машин, людей и грузовиков 1697 (39%) имели уверенность ниже 0.5
# и ещё 366 — ниже 0.6.
#
# Почему это важно именно для линии: идентификатор трека присваивается только
# тем объектам, которые попали в набор для первой ассоциации, то есть имеют
# уверенность не ниже track_high_thresh. Объект, который не получил трек, для
# пересечения линии не существует вовсе. При стандартных порогах это 39%
# объектов — почти половина проходов через линию не считалась бы.
#
# track_buffer: 30 кадров в стандартных настройках — это одна секунда видео.
# У нас кадры детекции идут раз в секунду, то есть тридцать секунд: объект,
# заслонённый на полминуты, терял прежний трек и получал новый. Шестьдесят
# кадров дают минуту, которая для машины, стоящей в очереди, важнее.

tracker_type: bytetrack
# Порог отбора детекций в первую ассоциацию. Согласован с CONFIDENCE=0.25.
track_high_thresh: 0.3
# Порог второго прохода: переотождествление объекта по низкой уверенности.
track_low_thresh: 0.1
# Порог создания нового трека. Ниже него объекту идентификатор не выдаётся.
new_track_thresh: 0.3
# Память о потерянном треке: 60 кадров при 1 кадре/с — это минута.
track_buffer: 60
# Порог сопоставления по расстоянию: 0.8 означает, что достаточно
# пересечения рамок около 20%. Рамки на медленных объектах перекрываются
# сильнее, а на быстрых при 1 кадре/с пересечения может не быть вовсе —
# объект получит новый трек, и пересечение линии не засчитается.
# Значение оставлено стандартным: проверено на живом кадре, что при шаге
# объекта 40 пикселей сопоставление проходит.
match_thresh: 0.8
fuse_score: True
