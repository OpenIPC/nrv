name: Сборка нативного клиента (Windows)

# Windows собираем в облаке, а не на рабочей машине: инструменты для
# Windows-сборки Qt приложения весят около гигабайта, и держать их на
# каждой машине разработки незачем.
#
# Сборка запускается только при изменениях в клиенте. Веб-интерфейс сюда
# не входит: клиент показывает страницы, которые отдаёт сервер.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client-windows.yml'
  # Ручной запуск — нужен, когда надо собрать версию без правок кода.
  workflow_dispatch:

jobs:
  build:
    name: Собрать nvr-wall.exe
    runs-on: windows-latest

    env:
      # Версию GStreamer держим здесь: её же использует скрипт установки.
      # Ветка 1.26 выбрана потому, что для неё ещё выкладывают установщики
      # MSI: начиная с 1.28 development-пакет собирают только как .exe,
      # и распаковать его в CI сложнее.
      #
      # Каталог установки (GSTREAMER_ROOT) не задаём: его определяет сам
      # установщик, а шаг установки передаёт найденный путь дальше.
      GSTREAMER_VERSION: '1.26.5'

    steps:
      - uses: actions/checkout@v4

      - name: Установить Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          # Без этого модуля нет VideoOutput и QtMultimedia.
          modules: 'qtmultimedia'
          cache: true

      - name: Установить GStreamer
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc"
          $runtime = "gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.msi"
          $devel = "gstreamer-1.0-devel-msvc-x86_64-$env:GSTREAMER_VERSION.msi"

          foreach ($file in @($runtime, $devel)) {
            Write-Host "Скачиваю $file"

            # Путь должен быть абсолютным: msiexec ищет файл-пакет относительно
            # system32 и на относительный путь отвечает «пакет не найден».
            $msi = Join-Path $env:RUNNER_TEMP $file
            Invoke-WebRequest "$base/$file" -OutFile $msi

            $log = "$msi.log"
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
              "/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$log`""
            )

            if ($process.ExitCode -ne 0) {
              # Показываем хвост журнала установщика: без него причина
              # остаётся загадкой, а сборка уже упала и не перезапускается.
              Write-Host "--- журнал установки $file ---"
              Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
              throw "Установка $file завершилась с кодом $($process.ExitCode)"
            }
          }

          # Путь не угадываем, а ищем по факту: установщик сам выбирает
          # каталог (обычно C:\gstreamer\1.0\msvc_x86_64), и от версии к
          # версии это может меняться.
          $lib = Get-ChildItem C:\gstreamer -Recurse -Filter gstreamer-1.0.lib -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $lib) {
            throw "После установки GStreamer не найден gstreamer-1.0.lib в C:\gstreamer"
          }

          # Каталог библиотек — родитель папки lib. В CMake путь пишем
          # с прямыми слэшами: обратный слэш в нём — escape-символ.
          $root = (Split-Path -Parent (Split-Path -Parent $lib.FullName)) -replace '\\', '/'
          Write-Host "GSTREAMER_ROOT=$root"

          # Передаём в последующие шаги через окружение запуска.
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Заодно печатаем версию: она попадает в отчёт сборки и помогает
          # понять, что именно собралось, когда что-то ведёт себя странно.
          & "$root/bin/gst-inspect-1.0.exe" --version

      - name: Собрать
        shell: pwsh
        run: |
          cmake -S client -B client/build -G "Visual Studio 17 2022" -A x64 `
                -DCMAKE_BUILD_TYPE=Release `
                -DGSTREAMER_ROOT="$env:GSTREAMER_ROOT"
          cmake --build client/build --config Release

      - name: Собрать поставку
        shell: pwsh
        run: |
          pwsh -File client/deploy/windows/deploy.ps1 `
               -BuildDir client/build/Release `
               -GStreamerRoot "$env:GSTREAMER_ROOT"

      - name: Проверить, что клиент запускается
        shell: pwsh
        run: |
          # Запускаем без графической сессии: окно не откроется, но
          # приложение должно дойти до загрузки интерфейса и не упасть
          # сразу. Падение здесь означает проблему с библиотеками или
          # плагинами, и лучше узнать об этом на сборке.
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process client/build/dist/nvr-wall.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Клиент завершился сразу после запуска (код $($process.ExitCode))"
          }
          $process.Kill()

      - name: Выложить архив
        uses: actions/upload-artifact@v4
        with:
          name: nvr-wall-win64
          path: client/build/dist
          retention-days: 30
