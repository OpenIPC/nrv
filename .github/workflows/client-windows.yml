name: Сборка нативного клиента (Windows)

# Windows собираем в облаке, а не на рабочей машине: инструменты для
# Windows-сборки Qt приложения весят около гигабайта, и держать их на
# каждой машине разработки незачем.
#
# Сборка запускается только при изменениях в клиенте. Веб-интерфейс сюда
# не входит: клиент показывает страницы, которые отдаёт сервер.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client-windows.yml'
  # Ручной запуск — нужен, когда надо собрать версию без правок кода.
  workflow_dispatch:

jobs:
  build:
    name: Собрать nvr-wall.exe
    runs-on: windows-latest

    env:
      # Версии GStreamer перебираются по порядку. Так надёжнее, чем
      # фиксированная одна: для новых веток development-пакет не всегда
      # выложен (у 1.28 и новее его нет вовсе — только runtime),
      # а без заголовков и .lib клиент не собрать.
      GSTREAMER_VERSIONS: '1.26.5,1.24.13'

    steps:
      - uses: actions/checkout@v4

      - name: Установить Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          # Без этого модуля нет VideoOutput и QtMultimedia.
          modules: 'qtmultimedia'
          cache: true

      - name: Кэш GStreamer
        uses: actions/cache@v4
        with:
          # Кэшируем распакованный GStreamer: это около 700 МБ загрузки,
          # и без кэша каждый запуск начинается с неё. Ключ включает
          # список версий — при его изменении кэш пересобирается.
          path: |
            ${{ runner.temp }}/gst-1.26.5
            ${{ runner.temp }}/gst-1.24.13
          key: gstreamer-msvc-${{ env.GSTREAMER_VERSIONS }}

      - name: Подготовить GStreamer
        shell: pwsh
        run: |
          # Административная распаковка (/a) вместо установки в систему:
          # она не трогает систему, не требует подтверждений и не ждёт окон.
          # Обычная установка строчек в CI вставала и держала сборку.
          $prepared = $null
          foreach ($version in $env:GSTREAMER_VERSIONS.Split(',')) {
            $version = $version.Trim()
            Write-Host "Пробую GStreamer $version"

            $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
            $dest = Join-Path $env:RUNNER_TEMP "gst-$version"
            $ok = $true

            # Если кэш уже распакован — скачивать и распаковывать нечего.
            $cached = Get-ChildItem $dest -Recurse -Filter gstreamer-1.0.lib -ErrorAction SilentlyContinue |
                      Select-Object -First 1
            if ($cached) {
              Write-Host "GStreamer $version взят из кэша"
            }
            else {
            foreach ($package in @("gstreamer-1.0", "gstreamer-1.0-devel")) {
              $file = "$package-msvc-x86_64-$version.msi"
              $msi = Join-Path $env:RUNNER_TEMP $file

              try {
                Invoke-WebRequest "$base/$file" -OutFile $msi -ErrorAction Stop
              } catch {
                Write-Host "Не скачался $base/$file — $($_.Exception.Message)"
                $ok = $false
                break
              }

              $log = "$msi.log"
              $process = Start-Process msiexec.exe -PassThru -ArgumentList @(
                "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$dest`"", "/l*v", "`"$log`"")

              # Таймаут обязателен: зависший установщик означает сорванную
              # сборку без единой строки в отчёте.
              if (-not $process.WaitForExit(600000)) {
                $process.Kill()
                Write-Host "Распаковка $file не завершилась за 10 минут"
                $ok = $false
                break
              }
              if ($process.ExitCode -ne 0) {
                Write-Host "--- журнал $file ---"
                Get-Content $log -Tail 30 -ErrorAction SilentlyContinue
                Write-Host "Распаковка $file вернула код $($process.ExitCode)"
                $ok = $false
                break
              }
            }
            }

            if ($ok) {
              $prepared = $dest
              "GST_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              break
            }
            Write-Host "Версия $version не подошла"
          }

          if (-not $prepared) {
            throw "Ни одну из версий GStreamer не удалось подготовить: $env:GSTREAMER_VERSIONS"
          }

          # Пути ищем по факту, а не угадываем: распаковка сохраняет
          # структуру установки, но её вид может отличаться от версии к версии.
          $lib = Get-ChildItem $prepared -Recurse -Filter gstreamer-1.0.lib -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $lib) {
            Write-Host "Содержимое каталога ${prepared}:"
            Get-ChildItem $prepared -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 30 -ExpandProperty FullName
            throw "В ${prepared} не найден gstreamer-1.0.lib"
          }

          $root = (Split-Path -Parent (Split-Path -Parent $lib.FullName)) -replace '\\', '/'
          $bin = "$root/bin"
          $plugins = "$root/lib/gstreamer-1.0"

          Write-Host "GSTREAMER_ROOT=$root"
          Write-Host "Плагинов найдено: $((Get-ChildItem $plugins -Filter *.dll -ErrorAction SilentlyContinue).Count)"

          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Плагины нужны проверке запуска: без них клиент покажет окно
          # требования, а нам важно проверить именно рабочий вариант.
          "GST_PLUGIN_PATH=$plugins" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Настроить MSVC
        # Генератор «Visual Studio …» на этом образе не находится, поэтому
        # собираем через Ninja, а окружение компилятора выставляет этот шаг:
        # он находит установленную Visual Studio и прописывает пути к cl.exe.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Собрать
        shell: pwsh
        run: |
          cmake -S client -B client/build -G Ninja `
                -DCMAKE_BUILD_TYPE=Release `
                -DGSTREAMER_ROOT="$env:GSTREAMER_ROOT"
          cmake --build client/build

      - name: Собрать поставку
        shell: pwsh
        run: |
          # При Ninja сборка одноконфигурационная: файлы лежат прямо в
          # каталоге сборки, без подкаталога Release.
          pwsh -File client/deploy/windows/deploy.ps1 `
               -BuildDir client/build `
               -GStreamerRoot "$env:GSTREAMER_ROOT"

      - name: Собрать полную поставку
        shell: pwsh
        run: |
          # Вторая поставка — с плагинами GStreamer внутри. Она нужна там,
          # где на машине нет установленного GStreamer. Тонкая поставка
          # берёт плагины из системы, но требует совпадения версий:
          # библиотека в клиенте и системная установка должны быть одной
          # версии, иначе плагины не подходят и видео не работает.
          pwsh -File client/deploy/windows/deploy.ps1 `
               -BuildDir client/build/Release `
               -GStreamerRoot "$env:GSTREAMER_ROOT" `
               -OutDir client/build/dist-full `
               -WithPlugins

      - name: Проверить, что в поставке есть все библиотеки
        shell: pwsh
        run: |
          # Проверяем по зависимостям самих файлов, а не по списку имён:
          # именно список упустил msvcp140_1.dll и msvcp140_2.dll, без
          # которых приложение закрывалось на дежурной машине сразу.
          pwsh -File client/deploy/windows/verify-deps.ps1 -DistDir client/build/dist

      - name: Проверить, что клиент запускается
        shell: pwsh
        run: |
          # Проверяем в «чистом» окружении: PATH из одних системных путей,
          # рабочая папка — сама поставка.
          #
          # Без этого проверка проходила за счёт того, что на сборочной
          # машине установлены и Qt, и Visual C++: нехватка библиотеки в
          # поставке не выявлялась, а всплывала у дежурного в виде «окно
          # мигнуло и закрылось».
          $dist = (Resolve-Path client/build/dist).Path
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:QT_QPA_PLATFORM = "offscreen"
          # Окно «нужен GStreamer» в автоматической проверке ждало бы
          # нажатия и держало сборку до таймаута.
          $env:NVR_NO_GSTREAMER_PROMPT = "1"

          $process = Start-Process (Join-Path $dist "nvr-wall.exe") -WorkingDirectory $dist -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Клиент завершился сразу после запуска (код $($process.ExitCode)). " +
                  "Обычно это значит, что в поставке нет нужной библиотеки."
          }
          $process.Kill()

      - name: Выложить архив
        uses: actions/upload-artifact@v4
        with:
          name: nvr-wall-win64
          path: client/build/dist
          retention-days: 30

      - name: Выложить полный архив
        uses: actions/upload-artifact@v4
        with:
          name: nvr-wall-win64-full
          path: client/build/dist-full
          retention-days: 30
