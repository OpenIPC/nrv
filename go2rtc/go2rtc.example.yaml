# go2rtc — медиасервер (заменил MediaMTX, см. plans/go2rtc-migration.md).
#
# Этот файл — образец. Рабочий go2rtc.yaml go2rtc дописывает сам, когда
# бэкенд регистрирует потоки через API: адреса камер с учётными данными
# в репозиторий не попадают, поэтому рабочий файл в .gitignore.

api:
  # WebUI и API: регистрация потоков, список, probe, HTTP-кадры.
  # По этому же порту go2rtc отдаёт HLS (`/api/stream.m3u8`) — тому, кто
  # его запросит (бэкенд для нативного клиента).
  listen: "0.0.0.0:1984"
  origin: "*"

rtsp:
  # RTSP-сервер go2rtc. Внутрь ходят бэкенд и ffmpeg самого go2rtc
  # (перекодирование звука), наружу — порт 9784 через nginx (rtsp-proxy).
  listen: ":8554"
  # Пароль для внешних потребителей. go2rtc сам отключает проверку для
  # адресов localhost, поэтому внутренние подключения (127.0.0.1) пароля
  # не видят, а запрос из сети — видит.
  #
  # Переменные подставляет compose из EXTERNAL_RTSP_USER/EXTERNAL_RTSP_PASS:
  # их же бэкенд показывает оператору на странице внешнего доступа.
  username: "${RTSP_EXTERNAL_USER:viewer}"
  password: "${RTSP_EXTERNAL_PASS:viewer}"

webrtc:
  # WebRTC: и TCP, и UDP на 8555. По UDP идёт сам медиапоток — если порт
  # закрыт, сессия создаётся, но кадры не приходят, и просмотр откатывается
  # на HLS (задержка в секунды).
  listen: ":8555"
  # Адреса, которые go2rtc предложит браузеру. Должен быть доступен тот,
  # по которому клиент реально доходит до сервера: локальный для работы
  # внутри сети, внешний — для доступа из интернета.
  candidates:
    - 192.168.1.111:8555
    - 83.243.73.86:8555
    - 127.0.0.1:8555

log:
  level: info
  format: text
